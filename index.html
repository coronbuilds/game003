/* =========================
   UPGRADE COST
========================= */

function getUpgradeCost(
    key
){

    const upgrade=
        upgrades[key];


    return Math.floor(
        upgrade.baseCost*
        Math.pow(
            1.65,
            upgrade.level
        )
    );

}


/* =========================
   CAN BUY
========================= */

function canBuyUpgrade(
    key
){

    const upgrade=
        upgrades[key];


    if(
        upgrade.level>=
        upgrade.max
    ){

        return false;

    }


    return permanentCoins>=
        getUpgradeCost(key);

}


/* =========================
   BUY UPGRADE
========================= */

function buyUpgrade(
    key
){

    if(
        !canBuyUpgrade(key)
    )
        return;


    const upgrade=
        upgrades[key];


    const cost=
        getUpgradeCost(key);


    permanentCoins-=
        cost;


    upgrade.level++;


    applyUpgrades();


    savePermanentData();


    createWarning(
        upgrade.name+
        " Lv."+
        upgrade.level,
        45
    );


    explosion(
        player.x+
        player.w/2,

        player.y+
        player.h/2,

        20
    );

}


/* =========================
   APPLY UPGRADES
========================= */

function applyUpgrades(){

    /*
       HP
    */

    player.maxHp=
        5+
        upgrades.maxHp.level;


    /*
       SPEED
    */

    player.speed=
        5.5+
        upgrades.moveSpeed.level*
        0.45;


    /*
       DASH
    */

    player.dashCooldown=
        Math.min(
            player.dashCooldown,
            Math.max(
                60,
                180-
                upgrades.dash.level*20
            )
        );


    /*
       FIRE RATE
    */

    Object.keys(weapons)
        .forEach(
            key=>{

                const weapon=
                    weapons[key];


                const baseRate=
                    key==="handgun"
                    ?8
                    :key==="shotgun"
                    ?28
                    :key==="machinegun"
                    ?3
                    :key==="laser"
                    ?18
                    :45;


                const reduction=
                    upgrades.fireRate.level*
                    0.12;


                weapon.fireRate=
                    Math.max(
                        1,
                        Math.floor(
                            baseRate-
                            reduction
                        )
                    );

            }
        );

}

            0.15
        )
    );

/* =========================
   WEAPON FIRE RATE
========================= */

function getWeaponFireRate(
    weaponName
){

    const weapon=
        weapons[
            weaponName
        ];

    const progress=
        weaponProgress[
            weaponName
        ];


    const reduction=
        (progress.level-1)*
        0.45;


    return Math.max(
        1,
        Math.floor(
            weapon.fireRate-
            reduction
        )
    );

}


/* =========================
   WEAPON AMMO BONUS
========================= */

function getWeaponMaxAmmo(
    weaponName
){

    const weapon=
        weapons[
            weaponName
        ];

    const progress=
        weaponProgress[
            weaponName
        ];


    return Math.floor(
        weapon.maxAmmo*
        (
            1+
            (progress.level-1)*
            0.05
        )
    );

}

    weaponName
){

    const data=
        weaponProgress[

        ];


    if(
        !data ||
        !data.unlocked
    )
        return;


    if(
        data.level>=
        data.maxLevel
    )
        return;


    const cost=
        getWeaponUpgradeCost(
            weaponName
        );


    if(
        permanentCoins<

    permanentCoins-=

    data.level++;


    applyWeaponProgress();


    saveWeaponProgress();


    createWarning(
        weapons[

        ].name+
        " Lv."+
        data.level,
        45
    );


    renderShop();

    weaponOrder.forEach(
        weaponName=>{

                    weaponName
                ];

            const weapon=
                weapons[
                    weaponName
                ];

            weapon.currentFireRate=

                );

function isWeaponUnlocked(
    weaponName
){

    return !!(
        weaponProgress[
            weaponName
        ] &&
        weaponProgress[
            weaponName
        ].unlocked
    );

}


/* =========================
   PROGRESSIVE UNLOCK
========================= */

function unlockWeaponsByStage(){

    const unlockTable={

        shotgun:2,

        machinegun:4,

        laser:6,

        rocket:8

    };


    Object.keys(
        unlockTable
    ).forEach(
        weaponName=>{

            const requiredStage=
                unlockTable[
                    weaponName
                ];


            if(
                stage>=
                requiredStage
            ){

                weaponProgress[
                    weaponName
                ].unlocked=true;

            }

        }
    );


    saveWeaponProgress();

}

        attempts<
        weaponOrder.length
    );


    equipWeapon(
        weaponOrder[
            weaponIndex
        ]
    );


    weaponSwitchCooldown=15;

};

let previousStageForUnlock=

function checkWeaponUnlock(){

    if(
        stage===
        previousStageForUnlock
    )
        return;


    previousStageForUnlock=
        stage;


    const before=
        weaponOrder.filter(
            name=>
                isWeaponUnlocked(name)
        ).length;


    unlockWeaponsByStage();


    const after=
        weaponOrder.filter(
            name=>
                isWeaponUnlocked(name)
        ).length;


    if(
        after>before
    ){

        createWarning(
            "🔓 NEW WEAPON!",
            100
        );


        shakeScreen(8);

    }

}

========================= */

function updateMissionProgress(
    id,
    amount
){

    const mission=
        missions.find(
            m=>
                m.id===id
        );


    if(
        !mission ||
        mission.completed
    )
        return;


    mission.progress+=
        amount;


    if(
        mission.progress>=
        mission.target
    ){

        mission.progress=
            mission.target;


        mission.completed=
            true;


        permanentCoins+=
            mission.reward;


        savePermanentData();

        saveMissions();


        createWarning(
            "MISSION CLEAR!",
            90
        );


        shakeScreen(7);

    }


    saveMissions();

}

    stage1:{
        name:"RED REAPER",

    }

};


let mainBoss=null;

let bossWarningTimer=0;

let bossIntroTimer=0;

let bossDefeatedTimer=0;


/* =========================
   BOSS SPAWN CHECK
========================= */

function shouldSpawnMainBoss(){

    /*
       5ステージごとにボス
    */

    if(
        stage<1
    )
        return false;


    if(
        stage%5!==0
    )
        return false;


    if(
        mainBoss
    )
        return false;


    if(
        bossIntroTimer>0 ||
        bossDefeatedTimer>0
    )
        return false;


    return true;

}


/* =========================
   CREATE BOSS
========================= */

function spawnMainBoss(){

    const bossNumber=
        Math.min(
            5,
            Math.max(
                1,
                Math.floor(
                    stage/5
                )
            )
        );


    const data=
        bossData[
            "stage"+
            bossNumber
        ];


    mainBoss={

        name:data.name,

        x:W+120,

        y:260,

        w:150,

        h:150,

        hp:data.hp+

            Math.floor(
                stage/5
            )*
            120,

        maxHp:data.hp+

            Math.floor(
                stage/5
            )*
            120,

        speed:data.speed,

        color:data.color,

        shootTimer:90,

        specialTimer:240,

        phase:1,

        direction:1,

        hitFlash:0,

        defeated:false

    };


    bossWarningTimer=
        150;


    bossIntroTimer=
        210;


    enemies.forEach(
        enemy=>{

            /*
               ボス登場時は
               通常敵を一旦消す
            */

            enemy.x=
                -500;

        }
    );


    createWarning(
        "WARNING",
        120
    );


    shakeScreen(12);

}


/* =========================
   BOSS BULLET
========================= */

function bossShoot(){

    if(
        !mainBoss
    )
        return;


    const centerX=
        mainBoss.x+
        mainBoss.w/2;


    const centerY=
        mainBoss.y+
        mainBoss.h/2;


    /*
       3方向
    */

    [-1,0,1].forEach(
        direction=>{

            enemyBullets.push({

                x:centerX,

                y:centerY,

                w:18,

                h:8,

                speed:-5,

                vy:
                    direction*
                    1.7,

                damage:
                    1+

                    Math.floor(
                        stage/5
                    )

            });

        }
    );

}


/* =========================
   BOSS SPECIAL ATTACK
========================= */

function bossSpecialAttack(){

    if(
        !mainBoss
    )
        return;


    const centerX=
        mainBoss.x+
        mainBoss.w/2;


    const centerY=
        mainBoss.y+
        mainBoss.h/2;


    /*
       放射状攻撃
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        const angle=
            Math.PI*2*
            i/
            12;


        enemyBullets.push({

            x:centerX,

            y:centerY,

            w:14,

            h:14,

            speed:
                Math.cos(angle)*
                4,

            vy:
                Math.sin(angle)*
                4,

            damage:1

        });

    }


    createWarning(
        "SPECIAL ATTACK",
        45
    );


    shakeScreen(10);

}


/* =========================
   UPDATE BOSS
========================= */

function updateMainBoss(){

    if(
        !mainBoss
    )
        return;


    if(
        bossIntroTimer>0
    ){

        bossIntroTimer--;

        if(
            mainBoss.x>
            W-230
        ){

            mainBoss.x-=
                mainBoss.speed*
                3;

        }

        return;

    }


    if(
        bossWarningTimer>0
    ){

        bossWarningTimer--;

    }


    /*
       PHASE
    */

    const hpRate=
        mainBoss.hp/
        mainBoss.maxHp;


    if(
        hpRate<=0.3
    ){

        mainBoss.phase=3;

    }
    else if(
        hpRate<=0.6
    ){

        mainBoss.phase=2;

    }
    else{

        mainBoss.phase=1;

    }


    /*
       移動
    */

    mainBoss.y+=
        mainBoss.direction*
        mainBoss.speed;


    if(
        mainBoss.y<170
    ){

        mainBoss.y=170;

        mainBoss.direction=1;

    }


    if(
        mainBoss.y>
        groundY-
        mainBoss.h-
        80
    ){

        mainBoss.y=
            groundY-
            mainBoss.h-
            80;

        mainBoss.direction=-1;

    }


    /*
       SHOOT
    */

    mainBoss.shootTimer--;


    if(
        mainBoss.shootTimer<=0
    ){

        bossShoot();


        mainBoss.shootTimer=
            Math.max(
                30,
                90-
                mainBoss.phase*
                15
            );

    }


    /*
       SPECIAL
    */

    mainBoss.specialTimer--;


    if(
        mainBoss.specialTimer<=0
    ){

        bossSpecialAttack();


        mainBoss.specialTimer=
            Math.max(
                120,
                300-
                mainBoss.phase*
                45
            );

    }


    if(
        mainBoss.hitFlash>0
    ){

        mainBoss.hitFlash--;

    }


    /*
       PLAYER COLLISION
    */

    if(
        rectHit(
            player,
            mainBoss
        )
    ){

        damagePlayer();

    }


    /*
       BOSS BULLET COLLISION
    */

    for(
        let i=
            bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];


        if(
            rectHit(
                bullet,
                mainBoss
            )
        ){

            /*
               ロケットは
               通常処理に任せる
            */

            if(
                bullet.type===
                "rocket"
            ){

                continue;

            }


            const damage=
                bullet.damage||
                1;


            mainBoss.hp-=
                damage;


            mainBoss.hitFlash=
                8;


            bullets.splice(
                i,
                1
            );


            createDamageText(
                mainBoss.x+
                mainBoss.w/2,

                mainBoss.y,

                damage
            );


            explosion(
                bullet.x,
                bullet.y,
                5
            );


            if(
                mainBoss.hp<=0
            ){

                defeatMainBoss();

                return;

            }

        }

    }

}


/* =========================
   BOSS DEFEAT
========================= */

function defeatMainBoss(){

    if(
        !mainBoss
    )
        return;


    const boss=
        mainBoss;


    mainBoss=null;


    bossDefeatedTimer=
        180;


    score+=
        5000+
        stage*
        1000;


    permanentCoins+=
        500+
        stage*
        100;


    savePermanentData();


    explosion(
        boss.x+
        boss.w/2,

        boss.y+
        boss.h/2,

        100
    );


    shakeScreen(25);


    createWarning(
        "BOSS DEFEATED!",
        120
    );


    unlockAchievement(
        "boss"
    );


    /*
       ボス後のステージ進行
    */

    stage++;


    saveGame();

}


/* =========================
   BOSS ROCKET DAMAGE
========================= */

function damageBossByRocket(
    bullet
){

    if(
        !mainBoss
    )
        return false;


    if(
        !rectHit(
            bullet,
            mainBoss
        )
    )
        return false;


    const damage=
        bullet.damage||
        10;


    mainBoss.hp-=
        damage;


    mainBoss.hitFlash=
        10;


    explosion(
        bullet.x,
        bullet.y,
        20
    );


    if(
        mainBoss.hp<=0
    ){

        defeatMainBoss();

    }


    return true;

}


/* =========================
   BOSS DRAW
========================= */

function drawMainBoss(){

    if(
        !mainBoss
    )
        return;


    const boss=
        mainBoss;


    ctx.save();


    /*
       AURA
    */

    const aura=
        15+
        Math.sin(
            gameTime*
            0.08
        )*
        8;


    ctx.globalAlpha=
        0.25;


    ctx.fillStyle=
        boss.color;


    ctx.beginPath();

    ctx.arc(
        boss.x+
        boss.w/2,

        boss.y+
        boss.h/2,

        75+
        aura,

        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.globalAlpha=1;


    /*
       BODY
    */

    ctx.fillStyle=
        boss.hitFlash>0
        ? "#ffffff"
        : boss.color;


    ctx.fillRect(
        boss.x,
        boss.y,
        boss.w,
        boss.h
    );


    /*
       EYES
    */

    ctx.fillStyle=
        "#ff0000";


    ctx.fillRect(
        boss.x+35,
        boss.y+45,
        22,
        18
    );


    ctx.fillRect(
        boss.x+93,
        boss.y+45,
        22,
        18
    );


    /*
       CORE
    */

    ctx.fillStyle=
        "#ffd600";


    ctx.beginPath();

    ctx.arc(
        boss.x+
        boss.w/2,

        boss.y+
        boss.h/2,

        20+
        Math.sin(
            gameTime*
            0.15
        )*
        4,

        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       HORNS
    */

    ctx.fillStyle=
        boss.color;


    ctx.beginPath();

    ctx.moveTo(
        boss.x+20,
        boss.y+5
    );

    ctx.lineTo(
        boss.x+45,
        boss.y-35
    );

    ctx.lineTo(
        boss.x+60,
        boss.y+15
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        boss.x+90,
        boss.y+15
    );

    ctx.lineTo(
        boss.x+105,
        boss.y-35
    );

    ctx.lineTo(
        boss.x+130,
        boss.y+5
    );

    ctx.fill();


    ctx.restore();


    /*
       HP BAR
    */

    const barW=
        430;

    const barH=
        18;

    const barX=
        (W-barW)/2;

    const barY=
        120;


    ctx.fillStyle=
        "#222";


    ctx.fillRect(
        barX,
        barY,
        barW,
        barH
    );


    ctx.fillStyle=
        "#ff2020";


    ctx.fillRect(
        barX,
        barY,
        barW*
        Math.max(
            0,
            mainBoss.hp/
            mainBoss.maxHp
        ),
        barH
    );


    ctx.strokeStyle=
        "#fff";

/* =========================
   BOSS UNIQUE TIMER
========================= */

let bossUniqueTimer=0;

let bossUniqueEffect=null;


/* =========================
   GET BOSS NUMBER
========================= */

function getCurrentBossNumber(){

    return Math.min(
        5,
        Math.max(
            1,
            Math.floor(
                stage/5
            )
        )
    );

}


/* =========================
   UNIQUE ATTACK
========================= */

function bossUniqueAttack(){

    if(
        !mainBoss
    )
        return;


    const number=
        getCurrentBossNumber();


    const data=
        uniqueBossData[number];


    if(
        !data
    )
        return;


    const cx=
        mainBoss.x+
        mainBoss.w/2;


    const cy=
        mainBoss.y+
        mainBoss.h/2;


    /*
       RED REAPER
       高速斬撃
    */

    if(
        data.attack==="slash"
    ){

        for(
            let i=0;
            i<7;
            i++
        ){

            enemyBullets.push({

                x:cx+
                    i*18,

                y:cy+
                    (
                        i-3
                    )*
                    35,

                w:30,

                h:8,

                speed:-9,

                vy:
                    (
                        i-3
                    )*
                    .5,

                damage:1

            });

        }


        bossUniqueEffect=
            "SLASH";

    }


    /*
       IRON BEAST
       ミサイル
    */

    else if(
        data.attack==="missile"
    ){

        for(
            let i=0;
            i<5;
            i++
        ){

            enemyBullets.push({

                x:cx,

                y:cy,

                w:18,

                h:10,

                speed:-3-
                    i*.5,

                vy:
                    (
                        player.y-
                        cy
                    )/
                    100+

                    (
                        i-2
                    )*
                    .5,

                damage:2,

                missile:true

            });

        }


        bossUniqueEffect=
            "MISSILE";

    }


    /*
       NIGHTMARE
       闇の弾幕
    */

    else if(
        data.attack==="dark"
    ){

        for(
            let i=0;
            i<20;
            i++
        ){

            const angle=
                Math.PI*2*
                i/
                20;


            enemyBullets.push({

                x:cx,

                y:cy,

                w:12,

                h:12,

                speed:
                    Math.cos(
                        angle
                    )*
                    5,

                vy:
                    Math.sin(
                        angle
                    )*
                    5,

                damage:1,

                dark:true

            });

        }


        bossUniqueEffect=
            "NIGHTMARE";

    }


    /*
       DEATH MACHINE
       レーザー
    */

    else if(
        data.attack==="laser"
    ){

        bossLaserAttack();

        bossUniqueEffect=
            "LASER";

    }


    /*
       RED DEVIL
       地獄の雨
    */

    else if(
        data.attack==="hell"
    ){

        for(
            let i=0;
            i<18;
            i++
        ){

            enemyBullets.push({

                x:
                    Math.random()*
                    W,

                y:
                    -30-
                    Math.random()*
                    500,

                w:14,

                h:28,

                speed:0,

                vy:
                    5+
                    Math.random()*
                    4,

                damage:1,

                hell:true

            });

        }


        bossUniqueEffect=
            "HELL";

    }


    bossUniqueTimer=
        70;


    shakeScreen(12);

}


/* =========================
   BOSS LASER
========================= */

let bossLaser=null;


function bossLaserAttack(){

    if(
        !mainBoss
    )
        return;


    bossLaser={

        x:mainBoss.x,

        y:mainBoss.y+
            mainBoss.h/2-
            12,

        width:W,

        height:24,

        timer:55

    };

}


/* =========================
   UPDATE LASER
========================= */

function updateBossLaser(){

    if(
        !bossLaser
    )
        return;


    bossLaser.timer--;


    /*
       プレイヤーへのダメージ
    */

    const laserBox={

        x:bossLaser.x,

        y:bossLaser.y,

        w:bossLaser.width,

        h:bossLaser.height

    };


    if(
        rectHit(
            player,
            laserBox
        )
    ){

        damagePlayer();

    }


    if(
        bossLaser.timer<=0
    ){

        bossLaser=null;

    }

}


/* =========================
   DRAW LASER
========================= */

function drawBossLaser(){

    if(
        !bossLaser
    )
        return;


    ctx.save();


    ctx.globalAlpha=
        .25;


    ctx.fillStyle=
        "#00eaff";


    ctx.fillRect(
        bossLaser.x,
        bossLaser.y-10,
        bossLaser.width,
        bossLaser.height+20
    );


    ctx.globalAlpha=1;


    ctx.fillStyle=
        "#fff";


    ctx.fillRect(
        bossLaser.x,
        bossLaser.y,
        bossLaser.width,
        bossLaser.height
    );


    ctx.restore();

}


/* =========================
   UNIQUE BULLET EFFECT
========================= */

function drawUniqueBullets(){

    enemyBullets.forEach(
        bullet=>{

            if(
                bullet.missile
            ){

                ctx.save();

                ctx.fillStyle=
                    "#ff7b00";

                ctx.fillRect(
                    bullet.x,
                    bullet.y,
                    bullet.w,
                    bullet.h
                );

                ctx.fillStyle=
                    "#ff2200";

                ctx.beginPath();

                ctx.arc(
                    bullet.x+
                    bullet.w+
                    4,

                    bullet.y+
                    bullet.h/2,

                    6,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.restore();

            }


            if(
                bullet.dark
            ){

                ctx.save();

                ctx.fillStyle=
                    "#a000ff";

                ctx.shadowBlur=
                    15;

                ctx.shadowColor=
                    "#a000ff";

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    8,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.restore();

            }


            if(
                bullet.hell
            ){

                ctx.save();

                ctx.fillStyle=

/* =========================
   BOSS WARNING SOUND
========================= */

let audioContext=null;


function playBossTone(){

    try{

        if(
            !audioContext
        ){

            audioContext=
                new (
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        }


        const osc=
            audioContext.createOscillator();


        const gain=
            audioContext.createGain();


        osc.type=
            "sawtooth";


        osc.frequency.value=
            90;


        gain.gain.value=
            0.04;


        osc.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        osc.start();


        osc.frequency.exponentialRampToValueAtTime(
            45,
            audioContext.currentTime+
            .45
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            .5
        );


        osc.stop(
            audioContext.currentTime+
            .5
        );

    }
    catch(e){}

}


/* =========================
   PHASE SOUND
========================= */

function playPhaseTone(){

    try{

        if(
            !audioContext
        ){

            audioContext=
                new (
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        }


        const osc=
            audioContext.createOscillator();


        const gain=
            audioContext.createGain();


        osc.type=
            "square";


        osc.frequency.value=
            180;


        gain.gain.value=
            .025;


        osc.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        osc.start();


        osc.frequency.exponentialRampToValueAtTime(
            420,
            audioContext.currentTime+
            .2
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            .25
        );


        osc.stop(
            audioContext.currentTime+
            .25
        );

    }
    catch(e){}

}

const realBossTone =

    playPhaseTone;


playBossTone = function(){

    if(!soundEnabled)
        return;

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type =
            "sawtooth";

        osc.frequency.value =
            90;

        gain.gain.value =
            0.04;

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.frequency.exponentialRampToValueAtTime(
            45,
            audioContext.currentTime + .45
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .5
        );

        osc.stop(
            audioContext.currentTime + .5
        );

    }
    catch(e){}

};


playPhaseTone = function(){

    if(!soundEnabled)
        return;

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type =
            "square";

        osc.frequency.value =
            180;

        gain.gain.value =
            0.025;

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.frequency.exponentialRampToValueAtTime(
            420,
            audioContext.currentTime + .2
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .25
        );

        osc.stop(
            audioContext.currentTime + .25
        );

    }
    catch(e){}

};

/* =========================

========================= */

function drawEnemyVisual(enemy){

    if(!enemy)
        return;


    const type =
        enemy.type || "normal";


    const visual =
        enemyVisuals[type] ||
        enemyVisuals.normal;


    const x =
        enemy.x;

    const y =
        enemy.y;

    const w =
        enemy.w;

    const h =
        enemy.h;


    ctx.save();


    /*
       HIT FLASH
    */

    if(
        enemy.hitFlash &&
        enemy.hitFlash>0
    ){

        ctx.globalAlpha =
            .8;

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            x-4,
            y-4,
            w+8,
            h+8
        );

        ctx.restore();

        return;

    }


    /* =====================
       NORMAL
    ===================== */

    if(type==="normal"){

        ctx.fillStyle =
            visual.dark;

        ctx.fillRect(
            x+5,
            y+15,
            w-10,
            h-15
        );


        ctx.fillStyle =
            visual.body;

        ctx.fillRect(
            x+8,
            y+8,
            w-16,
            h-20
        );


        /*
           HEAD
        */

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+12,
            13,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           EYES
        */

        ctx.fillStyle =
            visual.eye;

        ctx.fillRect(
            x+w/2-7,
            y+8,
            4,
            4
        );

        ctx.fillRect(
            x+w/2+3,
            y+8,
            4,
            4
        );


        /*
           GUN
        */

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            x-12,
            y+h/2,
            18,
            5
        );

    }


    /* =====================
       FAST
    ===================== */

    else if(type==="fast"){

        ctx.fillStyle =
            visual.dark;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y+h
        );

        ctx.lineTo(
            x+w/2,
            y
        );

        ctx.lineTo(
            x+w,
            y+h
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            visual.body;

        ctx.beginPath();

        ctx.moveTo(
            x+7,
            y+h-4
        );

        ctx.lineTo(
            x+w/2,
            y+8
        );

        ctx.lineTo(
            x+w-7,
            y+h-4
        );

        ctx.closePath();

        ctx.fill();


        /*
           EYE
        */

        ctx.fillStyle =
            visual.eye;

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h/2,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* =====================
       TANK
    ===================== */

    else if(type==="tank"){

        /*
           ARMOR
        */

        ctx.fillStyle =
            visual.dark;

        ctx.fillRect(
            x,
            y+8,
            w,
            h-8
        );


        ctx.fillStyle =
            visual.body;

        ctx.fillRect(
            x+5,
            y+12,
            w-10,
            h-16
        );


        /*
           ARMOR PLATES
        */

        ctx.fillStyle =
            "#888";

        ctx.fillRect(
            x+5,
            y+18,
            10,
            h-28
        );

        ctx.fillRect(
            x+w-15,
            y+18,
            10,
            h-28
        );


        /*
           HEAD
        */

        ctx.fillStyle =
            "#333";

        ctx.fillRect(
            x+10,
            y,
            w-20,
            20
        );


        /*
           EYE
        */

        ctx.fillStyle =
            visual.eye;

        ctx.fillRect(
            x+w/2-6,
            y+7,
            12,
            5
        );


        /*
           CANNON
        */

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            x-18,
            y+h/2,
            25,
            10
        );

    }


    /* =====================
       FLYING
    ===================== */

    else if(type==="flying"){

        /*
           WINGS
        */

        ctx.fillStyle =
            visual.dark;

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y+h/2
        );

        ctx.lineTo(
            x-18,
            y+5
        );

        ctx.lineTo(
            x+5,
            y+h/2
        );

        ctx.closePath();

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y+h/2
        );

        ctx.lineTo(
            x+w+18,
            y+5
        );

        ctx.lineTo(
            x+w-5,
            y+h/2
        );

        ctx.closePath();

        ctx.fill();


        /*
           BODY
        */

        ctx.fillStyle =
            visual.body;

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h/2,
            Math.min(w,h)/2,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           EYE
        */

        ctx.fillStyle =
            visual.eye;

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h/2,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* =====================
       CHARGER
    ===================== */

    else if(type==="charger"){

        ctx.fillStyle =
            visual.dark;

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y
        );

        ctx.lineTo(
            x+w,
            y+h
        );

        ctx.lineTo(
            x,
            y+h
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            visual.body;

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y+8
        );

        ctx.lineTo(
            x+w-7,
            y+h-7
        );

        ctx.lineTo(
            x+7,
            y+h-7
        );

        ctx.closePath();

        ctx.fill();


        /*
           HORNS
        */

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        ctx.moveTo(
            x+7,
            y+10
        );

        ctx.lineTo(
            x-8,
            y-5
        );

        ctx.lineTo(
            x+18,
            y+10
        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            x+w-7,
            y+10
        );

        ctx.lineTo(
            x+w+8,
            y-5
        );

        ctx.lineTo(
            x+w-18,
            y+10
        );

        ctx.fill();


        /*
           EYES
        */

        ctx.fillStyle =
            visual.eye;

        ctx.fillRect(
            x+w/2-10,
            y+28,
            7,
            5
        );

        ctx.fillRect(
            x+w/2+3,
            y+28,
            7,
            5
        );

    }


    /* =====================
       SNIPER
    ===================== */

    else if(type==="sniper"){

        /*
           BODY
        */

        ctx.fillStyle =
            visual.dark;

        ctx.fillRect(
            x+7,
            y+12,
            w-14,
            h-12
        );


        ctx.fillStyle =
            visual.body;

        ctx.fillRect(
            x+10,
            y+8,
            w-20,
            h-20
        );


        /*
           HEAD
        */

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+12,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           VISOR
        */

        ctx.fillStyle =
            visual.eye;

        ctx.fillRect(
            x+w/2-9,
            y+7,
            18,
            6
        );


        /*
           SNIPER RIFLE
        */

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            x-30,
            y+25,
            40,
            6
        );


        ctx.fillRect(
            x-7,
            y+30,
            5,
            15
        );

    }


    /* =====================
       ELITE
    ===================== */

    else if(type==="elite"){

        /*
           GLOW
        */

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            visual.body;


        ctx.fillStyle =
            visual.dark;

        ctx.fillRect(
            x,
            y,
            w,
            h
        );


        ctx.fillStyle =
            visual.body;

        ctx.fillRect(
            x+6,
            y+6,
            w-12,
            h-12
        );


        /*
           CORE
        */

        ctx.fillStyle =
            visual.eye;

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h/2,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ff0000";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h/2,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           SIDE BLADES
        */

        ctx.fillStyle =
            visual.body;

        ctx.fillRect(
            x-8,
            y+15,
            8,
            20
        );

        ctx.fillRect(
            x+w,
            y+15,
            8,
            20
        );

    }


    ctx.restore();

}

                );

    );

};

/* =========================
   FIRST APPEARANCE
========================= */

const seenEnemyTypes =
    new Set();


const oldSpawnEnemyVisual =
    spawnEnemy;


spawnEnemy=function(
    type
){

    const before =
        enemies.length;


    oldSpawnEnemyVisual(
        type
    );


    if(
        enemies.length>
        before
    ){

        const enemy =
            enemies[
                enemies.length-1
            ];


        if(
            enemy &&
            !seenEnemyTypes.has(
                enemy.type
            )
        ){

            seenEnemyTypes.add(
                enemy.type
            );

            showEnemyName(
                enemy.type
            );

        }

    }

};

/* =========================
   WAVE SYSTEM
========================= */

let waveNumber = 1;
let waveTimer = 0;
let waveKills = 0;
let waveTarget = 12;
let waveActive = false;
let waveBannerTimer = 0;

let spawnPatternTimer = 0;
let spawnPatternIndex = 0;


/* =========================
   WAVE DIFFICULTY
========================= */

function getWaveTarget(){

    return Math.min(
        40,
        10 +
        stage * 3 +
        waveNumber * 2
    );

}


function getWaveEnemyCount(){

    return Math.min(
        12,
        3 +
        Math.floor(stage / 2) +
        Math.floor(waveNumber / 2)
    );

}


/* =========================
   START WAVE
========================= */

function startWave(){

    waveActive = true;

    waveKills = 0;

    waveTarget =
        getWaveTarget();

    waveTimer = 0;

    waveBannerTimer = 100;

    spawnPatternTimer = 0;

    spawnPatternIndex =
        Math.floor(
            Math.random()*6
        );

}


/* =========================
   NEXT WAVE
========================= */

function nextWave(){

    waveNumber++;

    startWave();

    createWarning(
        "WAVE " + waveNumber,
        100
    );

}


/* =========================
   WAVE INITIALIZATION
========================= */

if(
    typeof waveNumber !== "undefined"
){

    startWave();

}


/* =========================
   SPAWN HELPERS
========================= */

function spawnWaveEnemy(
    type
){

    if(
        enemies.length >=
        getWaveEnemyCount()
    )
        return;


    spawnEnemy(type);

}


/* =========================
   RANDOM TYPE
========================= */

function getRandomWaveEnemy(){

    const r =
        Math.random();


    /*
       序盤
    */

    if(stage <= 1){

        if(r < .70)
            return "normal";

        if(r < .90)
            return "fast";

        return "tank";

    }


    /*
       STAGE 2+
    */

    if(stage === 2){

        if(r < .40)
            return "normal";

        if(r < .62)
            return "fast";

        if(r < .78)
            return "flying";

        if(r < .93)
            return "charger";

        return "tank";

    }


    /*
       STAGE 3+
    */

    if(stage === 3){

        if(r < .25)
            return "normal";

        if(r < .43)
            return "fast";

        if(r < .60)
            return "flying";

        if(r < .76)
            return "charger";

        if(r < .90)
            return "sniper";

        return "elite";

    }


    /*
       STAGE 4+
    */

    if(stage >= 4){

        if(r < .18)
            return "normal";

        if(r < .34)
            return "fast";

        if(r < .50)
            return "flying";

        if(r < .66)
            return "charger";

        if(r < .82)
            return "sniper";

        if(r < .94)
            return "tank";

        return "elite";

    }

}


/* =========================
   SPAWN PATTERN 1
   NORMAL RUSH
========================= */

function wavePatternRush(){

    spawnWaveEnemy(
        getRandomWaveEnemy()
    );

}


/* =========================
   SPAWN PATTERN 2
   FAST RUSH
========================= */

function wavePatternFast(){

    spawnWaveEnemy(
        "fast"
    );

    spawnWaveEnemy(
        "fast"
    );

}


/* =========================
   SPAWN PATTERN 3
   AIR ATTACK
========================= */

function wavePatternAir(){

    spawnWaveEnemy(
        "flying"
    );

    spawnWaveEnemy(
        "flying"
    );

}


/* =========================
   SPAWN PATTERN 4
   HEAVY
========================= */

function wavePatternHeavy(){

    spawnWaveEnemy(
        "tank"
    );

    spawnWaveEnemy(
        getRandomWaveEnemy()
    );

}


/* =========================
   SPAWN PATTERN 5
   SNIPER
========================= */

function wavePatternSniper(){

    spawnWaveEnemy(
        "sniper"
    );

    spawnWaveEnemy(
        "fast"
    );

}


/* =========================
   SPAWN PATTERN 6
   MIXED
========================= */

function wavePatternMixed(){

    spawnWaveEnemy(
        getRandomWaveEnemy()
    );

    spawnWaveEnemy(
        getRandomWaveEnemy()
    );

}


/* =========================
   EXECUTE PATTERN
========================= */

function executeWavePattern(){

    switch(
        spawnPatternIndex
    ){

        case 0:
            wavePatternRush();
            break;

        case 1:
            wavePatternFast();
            break;

        case 2:
            wavePatternAir();
            break;

        case 3:
            wavePatternHeavy();
            break;

        case 4:
            wavePatternSniper();
            break;

        case 5:
            wavePatternMixed();
            break;

    }

}


/* =========================
   WAVE UPDATE
========================= */

const oldWaveUpdate =
    update;


update=function(){

    oldWaveUpdate();


    if(
        !gameStarted ||
        gamePaused ||
        gameClear ||
        stageClearActive
    )
        return;


    if(
        mainBoss
    )
        return;


    waveTimer++;

    spawnPatternTimer--;


    /*
       まだ敵が少なければ
       ウェーブを進める
    */

    if(
        spawnPatternTimer <= 0 &&
        enemies.length <
        getWaveEnemyCount()
    ){

        executeWavePattern();

        spawnPatternTimer =
            Math.max(
                25,
                75 -
                stage*5 -
                waveNumber*2
            );

    }


    /*
       ウェーブクリア
    */

    if(
        waveKills >=
        waveTarget &&
        enemies.length === 0
    ){

        nextWave();

    }


    /*
       時間が長すぎた場合も
       強制的に次ウェーブへ
    */

    if(
        waveTimer > 1800
    ){

        nextWave();

    }

};


/* =========================
   COUNT KILLS
========================= */

const oldWaveKillEnemy =
    killEnemy;


killEnemy=function(
    enemy
){

    oldWaveKillEnemy(
        enemy
    );


    waveKills++;


    /*
       WAVE BONUS
    */

    if(
        waveKills ===
        waveTarget
    ){

        score +=
            250 +
            waveNumber*50;

        coins +=
            5 +
            waveNumber;

        createWarning(
            "WAVE BONUS!",
            70
        );

    }

};


/* =========================
   WAVE BANNER
========================= */

function drawWaveBanner(){

    if(
        waveBannerTimer <= 0
    )
        return;


    waveBannerTimer--;


    const alpha =
        Math.min(
            1,
            waveBannerTimer/20
        );


    ctx.save();


    ctx.globalAlpha =
        alpha;

    ctx.textAlign =
        "center";


    ctx.font =
        "bold 46px Arial";


    ctx.fillStyle =
        "#fff";


    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#ff0000";


    ctx.fillText(
        "WAVE " +
        waveNumber,
        W/2,
        340
    );


    ctx.font =
        "bold 17px Arial";


    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "#ff4444";


    ctx.fillText(
        waveKills +
        " / " +
        waveTarget,
        W/2,
        375
    );


    ctx.restore();

}


/* =========================
   WAVE HUD
========================= */

function drawWaveHUD(){

    if(
        !gameStarted ||
        mainBoss
    )
        return;


    const width =
        150;

    const height =
        7;

    const x =
        W -
        width -
        20;

    const y =
        180;


    const rate =
        Math.min(
            1,
            waveKills/
            waveTarget
        );


    ctx.save();


    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle =
        "#ff4040";

    ctx.fillRect(
        x,
        y,
        width*rate,
        height
    );


    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "right";

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        "WAVE " +
        waveNumber,
        W,
        y-5
    );


    ctx.restore();

}

========================= */

let powerEffects = {

/* =========================
   SPAWN POWER UP
========================= */

function spawnPowerUp(
    x,
    y
){

    const keys =
        Object.keys(
            powerUpTypes
        );


    const type =
        keys[
            Math.floor(
                Math.random()*
                keys.length
            )
        ];


    powerUps.push({

        x:x,
        y:y,

        w:32,
        h:32,

        type:type,

        vy:-2,

        life:900,

        rotation:0

    });

}


/* =========================
   DROP CHANCE
========================= */

function tryDropPowerUp(
    enemy
){

    if(!enemy)
        return;


    /*
       約8%でドロップ
    */

    if(
        Math.random() >
        .08
    )
        return;


    spawnPowerUp(
        enemy.x+
        enemy.w/2,

        enemy.y+
        enemy.h/2
    );

}


/* =========================
   KILL HOOK
========================= */

const oldPowerKillEnemy =
    killEnemy;


killEnemy=function(
    enemy
){

    tryDropPowerUp(
        enemy
    );


    oldPowerKillEnemy(
        enemy
    );

};


/* =========================
   UPDATE POWER UPS
========================= */

function updatePowerUps(){

    for(
        let i=
            powerUps.length-1;
        i>=0;
        i--
    ){

        const p =
            powerUps[i];


        p.y +=
            p.vy;


        p.vy +=
            .08;


        p.rotation +=
            .08;


        p.life--;


        /*
           地面
        */

        if(
            p.y+
            p.h >
            groundY
        ){

            p.y =
                groundY-
                p.h;

            p.vy *=
                -.45;

        }


        /*
           PLAYER PICKUP
        */

        if(
            rectHit(
                player,
                p
            )
        ){

            activatePowerUp(
                p.type
            );


            powerUps.splice(
                i,
                1
            );


            continue;

        }


        if(
            p.life<=0
        ){

            powerUps.splice(
                i,
                1
            );

        }

    }

}


/* =========================
   ACTIVATE POWER
========================= */

function activatePowerUp(
    type
){

    const data =
        powerUpTypes[type];


    if(!data)
        return;


    /*
       HEAL
    */

    if(
        type==="heal"
    ){

        player.hp =
            Math.min(
                player.maxHp,
                player.hp+2
            );

        createWarning(
            "+2 HP",
            70
        );

        haptic(40);

        return;

    }


    /*
       RAPID
    */

    if(
        type==="rapid"
    ){

        powerEffects.rapid =
            data.duration;

        createWarning(
            "RAPID FIRE!",
            80
        );

        haptic(30);

    }


    /*
       SHIELD
    */

    if(
        type==="shield"
    ){

        powerEffects.shield =
            data.duration;

        player.invincible =
            Math.max(
                player.invincible,
                90
            );

        createWarning(
            "SHIELD!",
            80
        );

        haptic(45);

    }


    /*
       DAMAGE
    */

    if(
        type==="damage"
    ){

        powerEffects.damage =
            data.duration;

        createWarning(
            "POWER UP!",
            80
        );

        haptic(35);

    }


    /*
       COIN
    */

    if(
        type==="coin"
    ){

        powerEffects.coin =
            data.duration;

        createWarning(
            "COIN RUSH!",
            80
        );

        haptic(25);

    }

}

   POWER TIMER
========================= */

update=function(){

    oldPowerUpdate();

/* =========================
   POWER DRAW
========================= */

function drawPowerUps(){

    powerUps.forEach(
        p=>{

            const data =
                powerUpTypes[
                    p.type
                ];


            if(!data)
                return;


            const cx =
                p.x+
                p.w/2;

            const cy =
                p.y+
                p.h/2;


            ctx.save();


            ctx.translate(
                cx,
                cy
            );


            ctx.rotate(
                p.rotation
            );


            /*
               GLOW
            */

            ctx.shadowBlur =
                20;

            ctx.shadowColor =
                data.color;


            /*
               DIAMOND
            */

            ctx.fillStyle =
                data.color;

            ctx.beginPath();

            ctx.moveTo(
                0,
                -16
            );

            ctx.lineTo(
                16,
                0
            );

            ctx.lineTo(
                0,
                16
            );

            ctx.lineTo(
                -16,
                0
            );

            ctx.closePath();

            ctx.fill();


            /*
               INNER
            */

            ctx.shadowBlur =
                0;

            ctx.fillStyle =
                "#111";


            ctx.beginPath();

            ctx.arc(
                0,
                0,
                10,
                0,
                Math.PI*2
            );

            ctx.fill();


            /*
               SYMBOL
            */

            ctx.fillStyle =
                data.color;

            ctx.font =
                "bold 16px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            ctx.fillText(
                data.symbol,
                0,
                1
            );


            ctx.restore();

        }
    );

}

function startFormation(){

    if(

        mainBoss ||
        stageClearActive ||
        gameClear
    )
        return;


    formationActive = true;

    formationTimer = 180;


    const type =

            )
        ];

/* =========================
   SPAWN FORMATION
========================= */

function spawnFormation(type){

    formationEnemies = [];


    /*
       LINE
    */

    if(type === "line"){

        for(
            let i=0;
            i<5;
            i++
        ){

            spawnWaveEnemy(
                i%2===0
                    ? "normal"
                    : "fast"
            );

            const e =
                enemies[
                    enemies.length-1
                ];

            if(e){

                e.x =
                    W +
                    50 +
                    i*65;

                e.y =
                    groundY -
                    e.h;

            }

        }

    }


    /*
       V
    */

    else if(type === "v"){

        const positions = [

            [0,0],
            [1,-60],
            [1,60],
            [2,-120],
            [2,120]

        ];


        positions.forEach(
            pos=>{

                spawnWaveEnemy(
                    "flying"
                );


                const e =
                    enemies[
                        enemies.length-1
                    ];


                if(e){

                    e.x =
                        W +
                        pos[0]*70;

                    e.y =
                        250+
                        pos[1];

                }

            }
        );

    }


    /*
       WALL
    */

    else if(type === "wall"){

        for(
            let i=0;
            i<6;
            i++
        ){

            spawnWaveEnemy(
                i<4
                    ? "normal"
                    : "tank"
            );


            const e =
                enemies[
                    enemies.length-1
                ];


            if(e){

                e.x =
                    W+
                    i*55;

                e.y =
                    groundY-
                    e.h;

            }

        }

    }


    /*
       RAIN
    */

    else if(type === "rain"){

        for(
            let i=0;
            i<8;
            i++
        ){

            spawnWaveEnemy(
                "flying"
            );


            const e =
                enemies[
                    enemies.length-1
                ];


            if(e){

                e.x =
                    W+
                    Math.random()*300;

                e.y =
                    150+
                    Math.random()*350;

            }

        }

    }


    /*
       SURROUND
    */

    else if(type === "surround"){

        for(
            let i=0;
            i<3;
            i++
        ){

            spawnWaveEnemy(

                p.y

            ctx.rotate(
                p.rotation
            );

                p.life/45;


            ctx.strokeStyle =
                "#ff3030";

            ctx.lineWidth =
                4;


            ctx.shadowBlur =
                20;

            ctx.shadowColor =
                "#ff0000";


            ctx.beginPath();


            ctx.arc(
                0,
                0,
                p.radius,
                0,
                Math.PI*2
            );


            ctx.stroke();


            ctx.restore();

        }

let eliteCommander = null;

function spawnEliteCommander(){

        eliteCommander
    )

    eliteCommander = {

        x:W+160,

        y:250,

        w:120,

        h:120,

        hp:
            180+
            stage*45,

        maxHp:
            180+

        timer:0,

        shotTimer:80,

        specialTimer:240,

        hitFlash:0,

    };

        180;


    createWarning(
        "ELITE COMMANDER",
        120
    );

}


/* =========================
   COMMANDER UPDATE
========================= */

function updateEliteCommander(){

    if(
        !eliteCommander
    )
        return;


    const b =
        eliteCommander;


    b.timer++;


    /*
       ENTER SCREEN
    */

    if(
        b.x >
        W-150
    ){

        b.x +=
            b.vx;

    }
    else{

        /*
           横揺れ
        */

        b.x =
            W-180+
            Math.sin(
                b.timer*.025
            )*60;


        /*
           縦揺れ
        */

        b.y =
            240+
            Math.sin(
                b.timer*.045
            )*120;

    }


    /*
       PHASE
    */

    const hpRate =
        b.hp/b.maxHp;


    if(
        hpRate<=.35
    ){

        b.phase=3;

    }
    else if(
        hpRate<=.65
    ){

        b.phase=2;

    }
    else{

        b.phase=1;

    }


    /*
       NORMAL SHOT
    */

    b.shotTimer--;

    if(
        b.shotTimer<=0
    ){

        commanderShoot();

        b.shotTimer =
            b.phase===3
                ? 35
                : b.phase===2
                    ? 50
                    : 75;

    }


    /*
       SPECIAL
    */

    b.specialTimer--;

    if(
        b.specialTimer<=0
    ){

        commanderSpecialAttack();

        b.specialTimer =
            b.phase===3
                ? 150
                : 240;

    }


    /*
       PLAYER COLLISION
    */

    if(
        rectHit(
            player,
            b
        )
    ){

        damagePlayer();

    }


    /*
       BULLET COLLISION
    */

    for(
        let i=
            bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        if(
            !bullet ||
            bullet.hitBoss
        )
            continue;


        if(
            rectHit(
                bullet,
                b
            )
        ){

            let damage =
                bullet.damage ||
                1;


            if(
                bullet.rocket
            ){

                damage *= 2;

            }


            b.hp -=
                damage;


            b.hitFlash =
                5;


            createDamageText(
                b.x+
                b.w/2,
                b.y,
                Math.round(damage)
            );


            bullets.splice(
                i,
                1
            );


            if(
                b.hp<=0
            ){

                defeatEliteCommander();

                return;

            }

        }

    }


    if(
        b.hitFlash>0
    ){

        b.hitFlash--;

    }

}


/* =========================
   SHOOT
========================= */

function commanderShoot(){

    if(
        !eliteCommander
    )
        return;


    const b =
        eliteCommander;


    const dx =
        player.x -
        b.x;

    const dy =
        player.y -
        b.y;


    const angle =
        Math.atan2(
            dy,
            dx
        );


    const count =
        b.phase===3
            ? 5
            : b.phase===2
                ? 3
                : 1;


    const spread =
        b.phase===3
            ? .75
            : .35;


    for(
        let i=0;
        i<count;
        i++
    ){

        const a =
            angle +
            (
                count===1
                    ? 0
                    :
                    (
                        i-
                        (count-1)/2
                    )*
                    spread
            );


        enemyBullets.push({

            x:
                b.x,

            y:
                b.y+
                b.h/2,

            w:12,

            h:12,

            vx:
                Math.cos(a)*7,

            vy:
                Math.sin(a)*7,

            damage:
                b.phase===3
                    ? 2
                    : 1,

            commander:true

        });

    }

}


/* =========================
   SPECIAL ATTACK
========================= */

function commanderSpecialAttack(){

    if(
        !eliteCommander
    )
        return;


    const b =
        eliteCommander;


    const count =
        b.phase===3
            ? 24
            : 16;


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            (
                Math.PI*2/count
            )*
            i;


        enemyBullets.push({

            x:
                b.x+
                b.w/2,

            y:
                b.y+
                b.h/2,

            w:10,

            h:10,

            vx:
                Math.cos(angle)*4,

            vy:
                Math.sin(angle)*4,

            damage:1,

            commanderRadial:true

        });

    }


    screenShake = 8;

}


/* =========================
   DEFEAT
========================= */

function defeatEliteCommander(){

    if(
        !eliteCommander
    )
        return;


    const x =
        eliteCommander.x+
        eliteCommander.w/2;


    const y =
        eliteCommander.y+
        eliteCommander.h/2;

       BIG EXPLOSION
    */

        i<70;
        i++
    ){

            vx:
                (Math.random()-.5)*

                18,

            size:
                3+
                Math.random()*10,

            color:

    }

    );

}


/* =========================
   DRAW
========================= */

function drawEliteCommander(){

    if(
        !eliteCommander
    )
        return;


    const b =
        eliteCommander;


    ctx.save();


    /*
       aura
    */

    ctx.shadowBlur =

    ctx.shadowColor =

    );

    ctx.lineWidth =
        5;


    ctx.strokeRect(
        b.x,
        b.y,
        b.w,
        b.h
    );


    /*
       core
    */

    ctx.fillStyle =
        "#ff3030";


    ctx.beginPath();

    ctx.arc(
        b.x+
        b.w/2,

        b.y+
        b.h/2,

        25+
        Math.sin(
            b.timer*.1
        )*5,

        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       eye
    */

    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        b.x+25,
        b.y+25,
        70,
        12
    );


    ctx.fillStyle =
        "#ff0000";


    ctx.fillRect(
        b.x+30,
        b.y+28,
        60,
        6
    );


    /*

    */

    ctx.fillStyle =
        "rgba(0,0,0,.7)";


    ctx.fillRect(
        b.x,
        b.y-18,
        b.w,

    );

        b.y-18,

/* =========================

========================= */

function updateFastEnemyAI(
    enemy
){

    if(
        !enemy ||
        enemy.type!=="fast"
    )
        return;


    /*
       プレイヤー方向へ
       少しだけ追尾
    */

    const targetY =
        player.y;


    if(
        enemy.y <
        targetY-20
    ){

        enemy.y +=
            .25;

    }
    else if(
        enemy.y >
        targetY+20
    ){

        enemy.y -=
            .25;

    }

}


/* =========================
   SNIPER AI
========================= */

function updateSniperAI(
    enemy
){

    if(
        !enemy ||
        enemy.type!=="sniper"
    )
        return;


    /*
       プレイヤーと
       同じ高さに近づく
    */

    if(
        Math.abs(
            enemy.y-
            player.y
        )>50
    ){

        enemy.y +=
            player.y>enemy.y
                ? .35
                : -.35;

    }

}


/* =========================
   CHARGER AI
========================= */

function updateChargerAI(
    enemy
){

    if(
        !enemy ||
        enemy.type!=="charger"
    )
        return;


    /*
       一定距離まで来たら
       一気に加速
    */

    if(
        enemy.x <
        W*.72
    ){

        enemy.vx =
            Math.max(
                enemy.vx||-2,
                -8
            );

    }

}

    )

        centerX;

    const dy =

        player.h/2-
        centerY;


    const angle =
        Math.atan2(

        bullet=>{

            if(
                !bullet ||
                !bullet.ultimateHoming
            )
                return;


            const dx =
                player.x+
                player.w/2-
                bullet.x;

            const dy =
                player.y+
                player.h/2-
                bullet.y;


            const angle =
                Math.atan2(
                    dy,
                    dx
                );


            const speed =
                Math.sqrt(
                    bullet.vx*
                    bullet.vx+
                    bullet.vy*
                    bullet.vy
                );


            const turn =
                .045;


            const current =
                Math.atan2(
                    bullet.vy,
                    bullet.vx
                );


            let diff =
                angle-current;


            while(
                diff >
                Math.PI
            ){

                diff -=
                    Math.PI*2;

            }


            while(
                diff <
                -Math.PI
            ){

                diff +=
                    Math.PI*2;

            }


            const next =
                current+
                Math.max(
                    -turn,
                    Math.min(
                        turn,
                        diff
                    )
                );


            bullet.vx =
                Math.cos(next)*
                speed;

            bullet.vy =
                Math.sin(next)*
                speed;

        }
    );

}

/* =========================
   FEVER TRIGGER
========================= */

function checkFeverRush(){

    if(
        feverRushActive ||
        feverRushCooldown>0
    )
        return;


    /*
       連続10キルで発動
    */

    if(
        killStreak >= 10
    ){

        startFeverRush();

        feverRushCooldown =
            1200;

    }


    /*
       FEVERゲージMAXでも発動
    */

    if(
        typeof feverGauge !==
        "undefined" &&
        feverGauge >= 100
    ){

        startFeverRush();

        feverGauge = 0;

        feverRushCooldown =
            1200;

    }

}


/* =========================
   FEVER UPDATE
========================= */

function updateFeverRush(){

    if(
        feverRushCooldown>0
    ){

        feverRushCooldown--;

    }


    if(
        !feverRushActive
    )
        return;


    feverRushTimer--;


    if(
        feverRushFlash>0
    ){

        feverRushFlash--;

    }


    /*
       FEVER中は敵出現を加速
    */

    if(
        feverRushTimer % 45 === 0
    ){

        spawnFeverEnemies();

    }


    /*
       終了
    */

    if(
        feverRushTimer<=0
    ){

        endFeverRush();

    }

}


/* =========================
   FEVER ENEMIES
========================= */

function spawnFeverEnemies(){

    if(
        !feverRushActive
    )
        return;


    const count =
        2+
        Math.floor(
            Math.random()*3
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const types = [
            "fast",
            "normal",
            "charger",
            "flying"
        ];


        const type =
            types[
                Math.floor(
                    Math.random()*
                    types.length
                )
            ];


        spawnEnemy(
            type
        );


        const e =
            enemies[
                enemies.length-1
            ];


        if(e){

            e.feverTarget =
                true;

        }

    }

}


/* =========================
   FEVER KILL BONUS
========================= */

const oldFeverRushKill =
    killEnemy;


killEnemy=function(
    enemy
){

    const beforeScore =
        score;


    const beforeCoins =
        coins;


    oldFeverRushKill(
        enemy
    );


    if(
        feverRushActive
    ){

        feverRushKills++;


        const gainedScore =
            Math.max(
                0,
                score-beforeScore
            );


        const gainedCoins =
            Math.max(
                0,
                coins-beforeCoins
            );


        /*
           SCORE x2
        */

        const bonusScore =
            Math.max(
                50,
                gainedScore
            );


        score +=
            bonusScore;


        feverRushScore +=
            bonusScore;


        /*
           COIN x2
        */

        const bonusCoins =
            Math.max(
                1,
                gainedCoins
            );


        coins +=
            bonusCoins;


        feverRushCoins +=
            bonusCoins;


        /*
           連続キル演出
        */

        if(
            feverRushKills % 5 === 0
        ){

            score += 500;

            feverRushScore += 500;

            createKillText(
                "FEVER +500"
            );

            screenShake = 8;

        }

    }

};


/* =========================
   END FEVER
========================= */

function endFeverRush(){

    if(
        !feverRushActive
    )
        return;


    feverRushActive = false;


    score +=
        feverRushKills*100;


    coins +=
        feverRushKills;


    createWarning(
        "FEVER COMPLETE!",
        100
    );


    screenShake = 18;


    /*
       結果保存
    */

    try{

        const oldBest =
            Number(
                localStorage.getItem(
                    "red_or_dead_2_fever_best"
                )
            ) || 0;


        if(
            feverRushScore >
            oldBest
        ){

            localStorage.setItem(
                "red_or_dead_2_fever_best",
                feverRushScore
            );

        }

    }
    catch(e){}

}

    enemies.forEach(
        enemy=>{

            if(!enemy)
                return;


            const dx =
                enemy.x+
                enemy.w/2-
                cx;

            const dy =
                enemy.y+
                enemy.h/2-
                cy;


            const dist =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                dist<radius
            ){

                enemy.hp -=
                    100+
                    stage*20;

                enemy.hitFlash =
                    20;

            }

        }
    );


    if(mainBoss){

        mainBoss.hp -=
            150+
            stage*20;

    }

}


/* =========================
   ULTIMATE BULLET UPDATE
========================= */

function updateWeaponUltimateBullets(){

    for(
        let i=
            bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        if(
            !b
        )
            continue;


        if(
            b.shotgunUltimate ||
            b.machineUltimate
        ){

            b.x +=
                b.vx;

            b.y +=
                b.vy;

        }


        /*
           巨大レーザー
        */

        if(
            b.life !== undefined &&
            !b.vx
        ){

            b.life--;

            if(
                b.life<=0
            ){

                bullets.splice(
                    i,
                    1
                );

            }

        }

    }

}

let cinematicFX = [];
let slowMotionTimer = 0;
let killFreezeTimer = 0;


/* =========================================================
   FX CREATE
========================================================= */

function createCinematicBurst(x,y,color="#ff3030",amount=25){

    for(let i=0;i<amount;i++){

        const a =
            Math.random() *
            Math.PI * 2;

        const speed =
            2 +
            Math.random()*9;

        cinematicFX.push({

            x:x,
            y:y,

            vx:
                Math.cos(a)*speed,

            vy:
                Math.sin(a)*speed,

            life:
                25+
                Math.random()*35,

            maxLife:
                60,

            size:
                2+
                Math.random()*7,

            color:color

        });

    }

}


/* =========================================================
   IMPACT FX
========================================================= */

function createImpactFX(enemy){

    if(!enemy)
        return;

    createCinematicBurst(
        enemy.x+enemy.w/2,
        enemy.y+enemy.h/2,
        "#ff3030",
        18
    );

    screenShake =
        Math.max(
            screenShake,
            8
        );

}


/* =========================================================
   KILL FX
========================================================= */

const oldCinematicKill =
    killEnemy;

killEnemy=function(enemy){

    if(enemy){

        createImpactFX(enemy);

        if(combo>=5){

            createCinematicBurst(
                enemy.x+enemy.w/2,
                enemy.y+enemy.h/2,
                combo>=20
                    ? "#ffd600"
                    : "#ffffff",
                combo>=20
                    ? 35
                    : 20
            );

        }

    }


    oldCinematicKill(enemy);


    if(combo>=10){

        slowMotionTimer =
            Math.max(
                slowMotionTimer,
                5
            );

    }

};


/* =========================================================
   UPDATE FX
========================================================= */

function updateCinematicFX(){

    for(
        let i=
            cinematicFX.length-1;
        i>=0;
        i--
    ){

        const p =
            cinematicFX[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vx *= .96;
        p.vy *= .96;

        p.vy += .12;

        p.life--;


        if(
            p.life<=0
        ){

            cinematicFX.splice(
                i,
                1
            );

        }

    }


    if(
        slowMotionTimer>0
    ){

        slowMotionTimer--;

    }


    if(
        killFreezeTimer>0
    ){

        killFreezeTimer--;

    }

}


/* =========================================================
   DRAW FX
========================================================= */

function drawCinematicFX(){

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for(
        const p of cinematicFX
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/p.maxLife
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}

let executionActive = false;
let executionTimer = 0;
let executionReady = false;
let executionFlash = 0;


/* =========================================================
   EXECUTION CHECK
========================================================= */

function checkExecution(){

    if(
        !mainBoss ||
        executionActive ||
        bossFinishActive
    )
        return;

    const hpRate =
        mainBoss.hp /
        mainBoss.maxHp;

    if(
        hpRate <= .08
    ){

        executionReady = true;

    }

}


/* =========================================================
   EXECUTION
========================================================= */

function executeBoss(){

    if(
        !executionReady ||
        !mainBoss ||
        executionActive
    )
        return;

    executionActive = true;

    executionTimer = 90;

    executionFlash = 60;

    player.invincible =
        Math.max(
            player.invincible,
            120
        );

    mainBoss.hp = 0;

    enemyBullets.length = 0;

    enemies.length = 0;

    score +=
        3000 +
        stage*500;

    coins +=
        20 +
        stage*3;

    screenShake = 35;

    createExecutionExplosion();

}


/* =========================================================
   EXECUTION EXPLOSION
========================================================= */

function createExecutionExplosion(){

    if(!mainBoss)
        return;

    const cx =
        mainBoss.x+
        mainBoss.w/2;

    const cy =
        mainBoss.y+
        mainBoss.h/2;


    for(
        let i=0;
        i<180;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            3+
            Math.random()*18;

        particles.push({

            x:cx,

            y:cy,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                50+
                Math.random()*90,

            size:
                3+
                Math.random()*11,

            color:
                Math.random()>.45
                    ? "#ff3030"
                    : "#ffd600"

        });

    }

}


/* =========================================================
   UPDATE
========================================================= */

const oldExecutionUpdate =
    update;

update=function(){

    oldExecutionUpdate();

    checkExecution();


    if(
        executionActive
    ){

        executionTimer--;

        executionFlash--;


        if(
            executionTimer<=0
        ){

            executionActive =
                false;

            executionReady =
                false;

        }

    }

};

========================================================= */

function createRandomEventEffect(){

    switch(
        randomEventType
    ){

        case "bloodRain":

            score += 500;

            break;


        case "goldRush":

            for(
                let i=0;
                i<12;
                i++
            ){

                    250,

                    Math.random()*

                );

            }

            break;


        case "enemyRush":

                i<8;
                i++

                spawnEnemy(
                    Math.random()>.5
                        ? "fast"
                        : "charger"
                );

            break;


        case "blackOut":
