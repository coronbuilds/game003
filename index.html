        case "ammoRain":

            weapons[currentWeapon].ammo =
                weapons[currentWeapon].maxAmmo;

            break;

    }

}


/* =========================================================
   EVENT UPDATE
========================================================= */

function updateRandomEvent(){

    if(
        randomEventCooldown>0
    ){

        randomEventCooldown--;

    }


    if(
        !randomEventActive
    ){

        if(
            randomEventCooldown<=0 &&
            Math.random()<0.0025
        ){

            startRandomEvent();

        }

        return;

    }


    randomEventTimer--;


    switch(
        randomEventType
    ){

        case "bloodRain":

            if(
                randomEventTimer%18===0
            ){

                for(
                    let i=0;
                    i<4;
                    i++
                ){

                    particles.push({

                        x:

                        y:

                        vx:

                        vy:

                        life:
                            35,

                        size:
                            2+
                            Math.random()*4,

                        color:
                            "#ff1744"

                    });

                }

            }

            break;


        case "goldRush":

            if(
                randomEventTimer%30===0
            ){

                spawnCoin(
                    80+
                    Math.random()*
                    (W-160),

                    300+
                    Math.random()*400
                );

            }

            break;


        case "enemyRush":

            if(
                randomEventTimer%70===0
            ){

                spawnEnemy(
                    Math.random()>.5
                        ? "fast"
                        : "flying"
                );

            }

            break;


        case "ammoRain":

            if(
                randomEventTimer%60===0

                    Math.min(
                        weapons[currentWeapon].maxAmmo,

                        weapons[currentWeapon].ammo+
                        2
                    );

            }

            break;

    }


    if(
        randomEventTimer<=0

        randomEventActive = false;

        randomEventType = "";

    }

function startCursedMode(){

        bossFinishActive ||
        gameClear
    )
        return;

    cursedMode = true;

            b.vy *= 1.45;
        }
    );

    createCursedExplosion();

/* =========================================================
   CURSED EXPLOSION
========================================================= */

function createCursedExplosion(){

    for(
        let i=0;
        i<90;
        i++
    ){

        const a =
            Math.random()*
            Math.PI*2;

        const s =
            3+
            Math.random()*14;

        particles.push({

            x:W/2,
            y:H/2,

            vx:
                Math.cos(a)*s,

            vy:
                Math.sin(a)*s,

            life:
                35+
                Math.random()*55,

            size:
                2+
                Math.random()*9,

            color:
                i%3===0
                    ? "#7c00ff"
                    : "#ff1744"

        });

    }

}


/* =========================================================
   CURSED ENEMY SPAWN
========================================================= */

function spawnCursedEnemy(){

    const types = [
        "fast",
        "charger",
        "flying",
        "sniper",
        "elite"
    ];

    const type =
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];

    spawnEnemy(type);

    const enemy =
        enemies[
            enemies.length-1
        ];

    if(enemy){

        enemy.cursed = true;

        enemy.hp =
            Math.floor(
                (enemy.hp || 10)*
                1.8
            );

        enemy.maxHp =
            enemy.hp;

        enemy.speed =
            (enemy.speed || 2)*
            1.35;

    }

}


/* =========================================================
   CURSED UPDATE
========================================================= */

function updateCursedMode(){

    if(
        cursedModeCooldown>0
    ){

        cursedModeCooldown--;

    }


    if(
        !cursedMode
    ){

        if(
            cursedModeCooldown<=0 &&
            Math.random()<0.0008
        ){

            startCursedMode();

        }

        return;

    }


    cursedModeTimer--;


    /*
       大量スポーン
    */

    if(
        cursedModeTimer%38===0
    ){

        spawnCursedEnemy();

    }


    /*
       弾速強化
    */

    if(
        cursedModeTimer%30===0
    ){

        enemyBullets.forEach(
            b=>{

                b.vx *= 1.025;
                b.vy *= 1.025;

            }
        );

    }


    /*
       プレイヤーへの圧力
    */

    if(
        cursedModeTimer%90===0
    ){

        for(
            let i=0;
            i<3;
            i++
        ){

            spawnCursedEnemy();

        }

    }


    if(
        cursedModeTimer<=0
    ){

        cursedMode = false;

        score +=
            500+
            cursedModeKills*100;

        coins +=
            Math.floor(
                cursedModeKills/3
            );

    }

}

/* =========================================================
   PART 6-O
   SURVIVAL / DANGER LEVEL SYSTEM
========================================================= */

let dangerLevel = 0;
let dangerTimer = 0;
let dangerFlash = 0;
let dangerMax = 100;


/* =========================================================
   DANGER CALC
========================================================= */

function updateDangerLevel(){

    if(!gameStarted)
        return;

    let danger = 0;

    /* 敵の数 */
    danger +=
        Math.min(
            30,
            enemies.length*2
        );

    /* 敵弾 */
    danger +=
        Math.min(
            30,
            enemyBullets.length*.8
        );

    /* ボス */
    if(mainBoss){

        const hpRate =
            mainBoss.hp /
            Math.max(
                1,
                mainBoss.maxHp
            );

        danger +=
            25;

        if(hpRate < .35)
            danger += 15;

    }

    /* HP */
    if(player){

        const hpRate =
            player.hp /
            Math.max(
                1,
                player.maxHp
            );

        if(hpRate < .5)
            danger += 15;

        if(hpRate < .25)
            danger += 25;

    }

    /* Cursed */
    if(
        typeof cursedMode !==
        "undefined" &&
        cursedMode
    ){

        danger += 20;

    }


    dangerLevel =
        Math.max(
            0,
            Math.min(
                dangerMax,
                danger
            )
        );


    if(
        dangerLevel>=75
    ){

        dangerTimer++;

        if(
            dangerTimer%45===0
        ){

            dangerFlash = 12;

        }

    }
    else{

        dangerTimer = 0;

    }

}


/* =========================================================
   UPDATE HOOK
========================================================= */

const oldDangerUpdate =
    update;

update=function(){

    oldDangerUpdate();

    updateDangerLevel();

    if(
        dangerFlash>0
    ){

        dangerFlash--;

    }

};


/* =========================================================
   DANGER COLOR
========================================================= */

function getDangerColor(){

    if(dangerLevel>=85)
        return "#ff1744";

    if(dangerLevel>=65)
        return "#ff6d00";

    if(dangerLevel>=40)
        return "#ffd600";

    return "#00e676";

}


/* =========================================================
   DANGER HUD
========================================================= */

function drawDangerHUD(){

    if(!gameStarted)
        return;


    const x = 20;
    const y = 270;
    const w = W-40;
    const h = 8;


    ctx.save();


    ctx.fillStyle =
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    ctx.fillStyle =
        getDangerColor();


    ctx.shadowBlur =
        dangerLevel>=75
            ? 15
            : 0;

    ctx.shadowColor =
        getDangerColor();


    ctx.fillRect(
        x,
        y,
        w*
        (
            dangerLevel/
            dangerMax
        ),
        h
    );


    ctx.shadowBlur = 0;

    ctx.textAlign =
        "left";

    ctx.font =
        "bold 11px Arial";

    ctx.fillStyle =
        "#fff";


    ctx.fillText(
        "DANGER",
        x,
        y-5
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        Math.floor(
            dangerLevel
        )+"%",
        x+w,
        y-5
    );


    ctx.restore();

}


/* =========================================================
   DANGER WARNING
========================================================= */

function drawDangerWarning(){

    if(
        dangerLevel<75
    )
        return;


    ctx.save();

    const pulse =
        .10+
        Math.sin(
            gameTime*.35
        )*.06;


    ctx.fillStyle =
        "rgba(255,0,0,"+
        pulse+
        ")";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.textAlign =
        "center";


    ctx.font =
        "900 25px Arial";


    ctx.fillStyle =
        dangerLevel>=90
            ? "#ff1744"
            : "#ff6d00";


    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#ff0000";


    ctx.fillText(
        dangerLevel>=90
            ? "CRITICAL"
            : "DANGER",
        W/2,
        470
    );


    ctx.restore();

}


/* =========================================================
   DAMAGE VIGNETTE
========================================================= */

function drawDangerVignette(){

    if(
        dangerLevel<50
    )
        return;


    const alpha =
        (
            dangerLevel-50
        )/
        50*.22;


    const gradient =
        ctx.createRadialGradient(
            W/2,
            H/2,
            H*.25,
            W/2,
            H/2,
            H*.75
        );


    gradient.addColorStop(
        0,
        "rgba(255,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,0,0,"+
        alpha+
        ")"
    );


    ctx.save();

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.restore();

}


/* =========================================================
   CRITICAL FLASH
========================================================= */

function drawDangerFlash(){

    if(
        dangerFlash<=0
    )
        return;


    ctx.save();

    ctx.fillStyle =
        "rgba(255,0,0,"+
        (dangerFlash/12)*.35+
        ")";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();

}

function getDailyKey(){

    const d =
        new Date();

    return (
        d.getFullYear()+
        "-" +
        (d.getMonth()+1)+
        "-" +
        d.getDate()
    );

}


/* =========================================================
   CREATE DAILY
========================================================= */

function loadDailyChallenge(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "red_or_dead_2_daily"
                )
            );


        if(
            saved &&
            saved.date ===
            getDailyKey()
        ){

            dailyChallenge =
                saved.challenge;

            dailyChallengeProgress =
                saved.progress || 0;

            dailyChallengeClaimed =
                !!saved.claimed;

            return;

        }

    }catch(e){}


    const challenge =
        dailyChallenges[
            Math.floor(
                Math.random()*
                dailyChallenges.length
            )
        ];


    dailyChallenge = {
        ...challenge
    };

    dailyChallengeProgress = 0;

    dailyChallengeClaimed = false;

    saveDailyChallenge();

}


/* =========================================================
   SAVE
========================================================= */

function saveDailyChallenge(){

    try{

        localStorage.setItem(
            "red_or_dead_2_daily",
            JSON.stringify({

                date:
                    getDailyKey(),

                challenge:
                    dailyChallenge,

                progress:
                    dailyChallengeProgress,

                claimed:
                    dailyChallengeClaimed

            })
        );

    }catch(e){}

}


/* =========================================================
   SET PROGRESS
========================================================= */

function setDailyProgress(value){

    if(
        !dailyChallenge ||
        dailyChallengeClaimed
    )
        return;


    dailyChallengeProgress =
        Math.max(
            dailyChallengeProgress,
            Math.min(
                dailyChallenge.target,
                value
            )
        );


    if(
        dailyChallengeProgress >=
        dailyChallenge.target
    ){

        dailyChallengeProgress =
            dailyChallenge.target;

        dailyChallengeFlash =
            120;

    }


    saveDailyChallenge();

}

   CLAIM
========================================================= */

function claimDailyChallenge(){

    if(
        !dailyChallenge ||
        dailyChallengeClaimed ||
        dailyChallengeProgress <
        dailyChallenge.target
    )
        return;


    dailyChallengeClaimed =
        true;


    score +=
        dailyChallenge.rewardScore;


    coins +=
        dailyChallenge.rewardCoins;


    permanentCoins +=
        dailyChallenge.rewardCoins;


    if(

            "rich"

   RANDOM CHOICES
========================================================= */

function generateRelicChoices(){

    relicChoices = [];

    const pool =
        relicData.filter(
            r=>!hasRelic(r.id)
        );


    while(
        relicChoices.length<3 &&
        pool.length>0
    ){

        const index =
            Math.floor(
                Math.random()*
                pool.length
            );

        relicChoices.push(
            pool.splice(
                index,
                1
            )[0]
        );

    }

}

/* =========================================================
   SELECT RELIC
========================================================= */

function selectRelic(id){

    if(
        !relicPending
    )
        return;


    const relic =
        relicData.find(
            r=>r.id===id
        );


    if(!relic)
        return;


    relics.push(id);

    applyRelic(id);

    relicPending = false;


    if(relicOverlay){

        relicOverlay.remove();

        relicOverlay = null;

    }


    createKillText(
        relic.name+"!"
    );


    screenShake = 10;

    saveRelics();

}


/* =========================================================
   APPLY RELIC
========================================================= */

function applyRelic(id){

    switch(id){

        case "guardian":

            player.maxHp += 2;

            player.hp =
                Math.min(
                    player.maxHp,
                    player.hp+2
                );

            break;


        case "runner":

            player.speed *= 1.20;

            break;


        case "berserk":

            break;


        case "hunter":

            break;


        case "vampire":

            break;


        case "fortune":

            break;


        case "executioner":

            break;


        case "overdrive":

            break;

    }

}

========================================================= */

function getRelicDamageMultiplier(){

    let multiplier = 1;


    if(
        hasRelic("berserk")
    ){

        multiplier *= 1.35;

    }


    return multiplier;

}

   BOSS DAMAGE MULTIPLIER
========================================================= */

    return hasRelic(
        "executioner"

        ? 1.30

}

        return amount*1.5;

    }


    return amount;

killEnemy=function(enemy){

    const beforeCoins =
        coins;

    oldRelicKill(enemy);


    /*
       Vampire
    */

    if(
        hasRelic("vampire") &&
        Math.random()<.10
    ){

        player.hp =
            Math.min(
                player.maxHp,
                player.hp+1
            );

    }


    /*
       Fortune
    */

    if(
        hasRelic("fortune")
    ){

        const gained =
            Math.max(
                0,
                coins-beforeCoins
            );

        if(gained>0){

            coins +=
                Math.floor(
                    gained*.5
                );

        }

    }

};

========================================================= */

const oldRelicShoot =
    shoot;

shoot=function(){

    const before =
        bullets.length;

    oldRelicShoot();


    const multiplier =
        getRelicDamageMultiplier();


    for(
        let i=before;
        i<bullets.length;
        i++
    ){

        if(
            bullets[i] &&
            bullets[i].damage
        ){

            bullets[i].damage *=
                multiplier;

        }

    }

};

   COMPANION DRONE SYSTEM
   自動攻撃する相棒ドローン
========================================================= */

let companionDrone = {
    active:false,
    level:1,
    x:0,
    y:0,
    angle:0,
    timer:0,
    shotTimer:0,
    flash:0,
    kills:0
};

const droneData = {
    1:{damage:2,fireRate:70,speed:8},
    2:{damage:3,fireRate:58,speed:9},
    3:{damage:4,fireRate:48,speed:10},
    4:{damage:6,fireRate:38,speed:11},
    5:{damage:9,fireRate:30,speed:12}
};

let droneBullets = [];


/* =========================================================
   DRONE START
========================================================= */

function activateDrone(){

    companionDrone.active=true;

    companionDrone.x=
        player.x+player.w/2;

    companionDrone.y=
        player.y-70;

    companionDrone.shotTimer=0;

}


/* =========================================================
   DRONE UPGRADE
========================================================= */

function upgradeDrone(){

    companionDrone.level=
        Math.min(
            5,
            companionDrone.level+1
        );

}


/* =========================================================
   FIND TARGET
========================================================= */

function getDroneTarget(){

    let target=null;
    let distance=Infinity;


    for(
        const enemy of enemies
    ){

        if(!enemy)
            continue;

        const dx =
            enemy.x-player.x;

        const dy =
            enemy.y-player.y;

        const d =
            Math.abs(dx)+
            Math.abs(dy);


        if(
            d<distance &&
            enemy.x>0 &&
            enemy.x<W
        ){

            distance=d;
            target=enemy;

        }

    }


    if(
        mainBoss &&
        mainBoss.hp>0
    ){

        return mainBoss;

    }


    return target;

}


/* =========================================================
   DRONE SHOOT
========================================================= */

function droneShoot(){

    const target=
        getDroneTarget();

    if(!target)
        return;


    const data=
        droneData[
            companionDrone.level
        ];


    const sx=
        companionDrone.x;

    const sy=
        companionDrone.y;


    const tx=
        target.x+
        target.w/2;

    const ty=
        target.y+
        target.h/2;


    const dx=tx-sx;
    const dy=ty-sy;

    const len=
        Math.sqrt(
            dx*dx+
            dy*dy
        )||1;


    droneBullets.push({

        x:sx,
        y:sy,

        vx:
            dx/len*
            data.speed,

        vy:
            dy/len*
            data.speed,

        damage:
            data.damage,

        life:120,

        size:6

    });


    companionDrone.flash=5;

}


/* =========================================================
   DRONE UPDATE
========================================================= */

function updateDrone(){

    if(!companionDrone.active)
        return;


    const t=
        gameTime/18;


    const targetX=
        player.x+
        player.w/2+
        Math.cos(t)*
        48;

    const targetY=
        player.y-
        65+
        Math.sin(t*1.4)*
        18;


    companionDrone.x +=
        (targetX-
         companionDrone.x)*
        .12;

    companionDrone.y +=
        (targetY-
         companionDrone.y)*
        .12;


    const data=
        droneData[
            companionDrone.level
        ];


    companionDrone.shotTimer--;


    if(
        companionDrone.shotTimer<=0
    ){

        droneShoot();

        companionDrone.shotTimer=
            data.fireRate;

    }


    if(
        companionDrone.flash>0
    ){

        companionDrone.flash--;

    }


    updateDroneBullets();

}


/* =========================================================
   DRONE BULLETS
========================================================= */

function updateDroneBullets(){

    for(
        let i=droneBullets.length-1;
        i>=0;
        i--
    ){

        const b=
            droneBullets[i];

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e=
                enemies[j];

            if(
                !e ||
                e.dead
            )
                continue;


            if(
                b.x>
                e.x &&
                b.x<
                e.x+e.w &&
                b.y>
                e.y &&
                b.y<
                e.y+e.h
            ){

                e.hp -=
                    b.damage;

                e.hitFlash=5;

                createImpactFX(
                    b.x,
                    b.y
                );


                hit=true;


                if(
                    e.hp<=0
                ){

                    killEnemy(e);

                    companionDrone.kills++;

                }


                break;

            }

        }


        if(
            !hit &&
            mainBoss &&
            mainBoss.hp>0 &&
            b.x>mainBoss.x &&
            b.x<mainBoss.x+mainBoss.w &&
            b.y>mainBoss.y &&
            b.y<mainBoss.y+mainBoss.h
        ){

            mainBoss.hp -=
                b.damage;

            createImpactFX(
                b.x,
                b.y
            );

            hit=true;

        }


        if(
            hit ||
            b.life<=0 ||
            b.x<-100 ||
            b.x>W+100 ||
            b.y<-100 ||
            b.y>H+100
        ){

            droneBullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DRAW DRONE
========================================================= */

function drawDrone(){

    if(!companionDrone.active)
        return;


    const x=
        companionDrone.x;

    const y=
        companionDrone.y;


    ctx.save();


    /* shadow */

    ctx.globalAlpha=.25;

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+18,
        28,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.globalAlpha=1;


    /* glow */

    ctx.shadowBlur=
        companionDrone.flash>0
        ? 25
        : 12;

    ctx.shadowColor=
        "#00e5ff";


    /* wings */

    ctx.fillStyle=
        "#263238";

    ctx.beginPath();

    ctx.moveTo(x-28,y);
    ctx.lineTo(x-8,y-9);
    ctx.lineTo(x-5,y+10);
    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(x+28,y);
    ctx.lineTo(x+8,y-9);
    ctx.lineTo(x+5,y+10);
    ctx.closePath();

    ctx.fill();


    /* body */

    ctx.fillStyle=
        "#90caf9";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eye */

    ctx.fillStyle=
        "#00ffff";

    ctx.beginPath();

    ctx.arc(
        x,
        y-2,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* level */

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "DRONE Lv."+companionDrone.level,
        x,
        y+34
    );


    ctx.restore();

}


/* =========================================================
   DRAW DRONE BULLETS
========================================================= */

function drawDroneBullets(){

    for(
        const b of droneBullets
    ){

        ctx.save();

        ctx.shadowBlur=15;

        ctx.shadowColor=
            "#00e5ff";

        ctx.fillStyle=
            "#00ffff";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}

function spawnLootChest(x,y){

    lootChests.push({

        x:x || W/2,

        y:y || 650,

        w:54,

        h:45,

        life:900,

        bob:Math.random()*6,

        opened:false

    });

}


/* =========================================================
   CHEST DROP
========================================================= */

function trySpawnLootChest(enemy){

    if(!enemy)
        return;

    /*
       12% chance
       tank / elite / special enemies
       は少し高確率
    */

    let chance=.12;

    if(
        enemy.type==="tank" ||
        enemy.type==="elite"
    ){

        chance=.28;

    }


    if(
        mainBoss &&
        enemy===mainBoss
    ){

        chance=0;

    }


    if(
        Math.random()<chance
    ){

        spawnLootChest(
            enemy.x+
            enemy.w/2,

            enemy.y+
            enemy.h/2
        );

    }

}

   KILL HOOK

    oldChestKill(enemy);

    trySpawnLootChest(enemy);

/* =========================================================
   UPDATE CHESTS
========================================================= */

function updateLootChests(){

    for(
        let i=lootChests.length-1;
        i>=0;
        i--
    ){

        const chest=
            lootChests[i];

        chest.life--;

        chest.bob+=.08;


        /*

        */

        if(
            !chest.opened &&

            player.x<
                chest.x+
                chest.w &&

            player.x+
                player.w>
                chest.x &&

            player.y<
                chest.y+
                chest.h &&

            player.y+
                player.h>
                chest.y
        ){

            openLootChest(
                chest
            );

            lootChests.splice(
                i,
                1
            );

            continue;

        }


        if(
            chest.life<=0
        ){

            lootChests.splice(
                i,
                1
            );

        }

    }

}

/* =========================================================
   CLAIM
========================================================= */

function claimChestReward(
    reward
){

    if(!reward)
        return;


    switch(
        reward.id
    ){

        case "coins":

            coins+=30;

            break;


        case "heal":

            player.hp=
                Math.min(
                    player.maxHp,
                    player.hp+2
                );

            break;


        case "ult":

            addWeaponUltimate(35);

            break;


        case "ammo":

            Object.keys(
                weapons
            ).forEach(
                key=>{

                    weapons[key].ammo=
                        weapons[key].maxAmmo;

                }
            );

            if(
                typeof currentWeapon!=="undefined"
            ){

                currentWeapon.ammo=
                    currentWeapon.maxAmmo;

            }

            break;


        case "score":

            score+=1000;

            break;


        case "fever":

            if(
                typeof feverGauge!=="undefined"
            ){

                feverGauge=
                    Math.min(
                        100,
                        feverGauge+30
                    );

            }

            break;

    }


    createKillText(
        reward.name+
        "!"
    );


    if(
        typeof haptic==="function"
    ){

        haptic(
            "heavy"
        );

    }


    if(chestOverlay){

        chestOverlay.remove();

        chestOverlay=null;

    }


    chestOpenActive=false;

}

            chest.h

   「画面を一気にゲームっぽくする」
========================================================= */

let lightingFlash = 0;
let lightingColor = "#ff0000";
let lightingPulse = 0;
let dangerVignette = 0;


/* =========================================================
   LIGHT BURST
========================================================= */

function createLightBurst(
    x,
    y,
    color="#ffffff",
    power=1
){

    lightingColor=color;

    lightingFlash=
        Math.max(
            lightingFlash,
            18*power
        );

    lightingPulse=
        Math.max(
            lightingPulse,
            12*power
        );

}


/* =========================================================
   COMPOSITE LIGHTING
========================================================= */

function drawLightingFX(){

    ctx.save();


    /*
       全画面フラッシュ
    */

    if(
        lightingFlash>0
    ){

        const alpha=
            Math.min(
                .28,
                lightingFlash/80
            );


        ctx.fillStyle=
            lightingColor;


        ctx.globalAlpha=
            alpha;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        lightingFlash--;

    }


    /*
       パルス
    */

    if(
        lightingPulse>0
    ){

        const radius=
            180+
            lightingPulse*12;


        const gradient=
            ctx.createRadialGradient(
                W/2,
                H/2,
                10,
                W/2,
                H/2,
                radius
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,.08)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        ctx.fillStyle=
            gradient;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        lightingPulse-=.7;

    }


    /*
       危険時の赤ビネット
    */

    if(
        dangerVignette>0
    ){

        const g=
            ctx.createRadialGradient(
                W/2,
                H/2,
                H*.25,
                W/2,
                H/2,
                H*.75
            );


        g.addColorStop(
            0,
            "rgba(255,0,0,0)"
        );

        g.addColorStop(
            .65,
            "rgba(255,0,0,0)"
        );

        g.addColorStop(
            1,
            "rgba(255,0,0,"+
            dangerVignette+
            ")"
        );


        ctx.fillStyle=g;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    ctx.restore();

}

   HIT EFFECT

killEnemy=function(enemy){

    if(enemy){

/* =========================================================
   DANGER LIGHT
========================================================= */

function updateDangerLighting(){

    let danger=0;


    if(
        enemies &&
        enemies.length
    ){

        danger +=
            Math.min(
                45,
                enemies.length*3
            );

    }


    if(
        enemyBullets &&
        enemyBullets.length
    ){

        danger +=
            Math.min(
                30,
                enemyBullets.length*1.5
            );

    }


    if(mainBoss){

        danger+=35;

    }


    if(
        player &&
        player.maxHp>0
    ){

        const hpRatio=
            player.hp/
            player.maxHp;


        if(hpRatio<.35){

            danger+=30;

        }

    }


    danger=
        Math.min(
            100,
            danger
        );


    if(
        danger>=75
    ){

        dangerVignette=
            .12+
            Math.sin(
                gameTime*.15
            )*.06;

    }else{

        dangerVignette=
            Math.max(
                0,
                dangerVignette-.01
            );

    }

}

   COMBO FINISHER / MEGA KILL SYSTEM
   連続撃破で画面中央に派手なフィニッシャー演出
========================================================= */

let finisherMeter = 0;
let finisherMax = 100;
let finisherActive = false;
let finisherTimer = 0;
let finisherFlash = 0;
let finisherKills = 0;
let finisherScore = 0;


/* =========================================================
   CHARGE
========================================================= */

function addFinisherCharge(amount){

    if(finisherActive)
        return;

    finisherMeter =
        Math.min(
            finisherMax,
            finisherMeter + amount
        );

}


/* =========================================================
   READY
========================================================= */

function finisherReady(){

    return finisherMeter>=finisherMax;
}


/* =========================================================
   ACTIVATE
========================================================= */

function activateFinisher(){

    if(
        finisherActive ||
        !finisherReady() ||
        !gameStarted ||
        paused
    )
        return;


    finisherActive=true;

    finisherTimer=90;

    finisherFlash=30;

    finisherKills=0;

    finisherScore=0;


    /*
       画面上の通常敵を一掃
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];

        if(!enemy)
            continue;


        const value =
            enemy.type==="tank"
            ? 3
            : enemy.type==="elite"
            ? 5
            : 1;


        finisherKills += value;


        finisherScore +=
            100*value;


        createImpactFX(
            enemy.x+
            enemy.w/2,
            enemy.y+
            enemy.h/2
        );


        try{

            killEnemy(enemy);

        }catch(e){}

    }


    /*
       弾幕を消す
    */

    if(
        Array.isArray(enemyBullets)
    ){

        enemyBullets.length=0;

    }


    /*
       一時無敵
    */

    player.invincible =
        Math.max(
            player.invincible||0,
            100
        );


    /*
       スコア
    */

    score +=
        finisherScore;


    coins +=
        Math.floor(
            finisherKills/2
        );


    finisherMeter=0;


    createLightBurst(
        W/2,
        H/2,
        "#ffffff",
        5
    );


    screenShake=25;


    createKillText(
        "MEGA FINISH!"
    );

}


/* =========================================================
   UPDATE
========================================================= */

function updateFinisher(){

    if(!finisherActive)
        return;


    finisherTimer--;


    /*
       フィニッシャー中に追加演出
    */

    if(
        finisherTimer%12===0
    ){

        createLightBurst(
            Math.random()*W,
            250+
            Math.random()*450,
            "#ffd600",
            1
        );

    }


    if(
        finisherTimer<=0
    ){

        finisherActive=false;

    }

}


/* =========================================================
   DRAW
========================================================= */

function drawFinisher(){

    if(
        !finisherActive &&
        finisherFlash<=0
    )
        return;


    if(
        finisherFlash>0
    ){

        ctx.save();

        ctx.fillStyle=
            "rgba(255,255,255,"+
            (finisherFlash/70)+
            ")";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.restore();

        finisherFlash--;

    }


    if(!finisherActive)
        return;


    ctx.save();


    /*
       暗転
    */

    ctx.fillStyle=
        "rgba(0,0,0,.42)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       中央タイトル
    */

    const scale =
        1+
        Math.sin(
            finisherTimer*.35
        )*.08;


    ctx.translate(
        W/2,
        H/2
    );

    ctx.scale(
        scale,
        scale
    );


    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.font=
        "900 48px Arial";


    ctx.lineWidth=12;

    ctx.strokeStyle=
        "#000";


    ctx.strokeText(
        "MEGA FINISH!",
        0,
        -25
    );


    ctx.fillStyle=
        "#ffd600";


    ctx.fillText(
        "MEGA FINISH!",
        0,
        -25
    );


    ctx.font=
        "900 20px Arial";


    ctx.fillStyle=
        "#fff";


    ctx.fillText(
        finisherKills+
        " KILLS",
        0,
        25
    );


    ctx.font=
        "bold 16px Arial";


    ctx.fillStyle=
        "#00ffff";


    ctx.fillText(
        "+"+
        finisherScore+
        " SCORE",
        0,
        55
    );


    ctx.restore();

}

        finisherMeter/
        finisherMax;


    ctx.save();


    ctx.textAlign="center";

    ctx.font=
        "bold 11px Arial";

        finisherReady()
        ? "#ffd600"

        y+7,
        width,

    );


    ctx.fillStyle=
        finisherReady()
        ? "#ffd600"
        : "#ff1744";


    ctx.fillRect(
        x-width/2,
        y+7,
        width*ratio,
        8
    );


    ctx.restore();

        case "damage":

            if(
                typeof rogueShopDamageBonus===
                "undefined"
            ){

                rogueShopDamageBonus=0;

            }

            rogueShopDamageBonus+=.10;

            break;


        case "hp":

            player.maxHp+=1;

            player.hp=
                Math.min(
                    player.maxHp,
                    player.hp+1
                );

            break;


        case "ammo":

            Object.keys(
                weapons
            ).forEach(
                key=>{

                    const weapon=
                        weapons[key];

                    weapon.maxAmmo=
                        Math.ceil(
                            weapon.maxAmmo*
                            1.10
                        );

                    weapon.ammo=
                        weapon.maxAmmo;

                }
            );

            break;


        case "speed":

            player.speed*=1.08;

            break;


        case "ult":

            addWeaponUltimate(25);

            break;


        case "heal":

            player.hp=
                player.maxHp;

            break;

    }

}

let rogueShopDamageBonus=0;

const oldRogueShopShoot =
    shoot;

shoot=function(){

    const before=
        bullets.length;


    oldRogueShopShoot();


    if(
        rogueShopDamageBonus<=0
    )
        return;


    for(
        let i=before;
        i<bullets.length;
        i++
    ){

        if(
            bullets[i] &&
            typeof bullets[i].damage==="number"
        ){

            bullets[i].damage*=
                1+
                rogueShopDamageBonus;

        }

    }

};

    const d=new Date();

    return (
        d.getFullYear()+
        "-" +
        String(d.getMonth()+1).padStart(2,"0")+
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}

            );


        if(saved){

            loginData={
                ...loginData,
                ...saved
            };

        }

    }catch(e){}


    const today=
        getLoginDate();


    if(
        loginData.lastDate!==today
    ){

        loginData.claimed=false;

    }


    saveLoginData();

/* =========================================================
   CLAIM
========================================================= */

function claimLoginReward(){

    const today=
        getLoginDate();


    if(
        loginData.claimed &&
        loginData.lastDate===today
    ){

        return;

    }


    /*
       連続ログイン判定
    */

    if(
        loginData.lastDate
    ){

        const previous=
            new Date(
                loginData.lastDate
            );

        const current=
            new Date(today);


        const diff=
            Math.floor(
                (
                    current-
                    previous
                )/
                86400000
            );


        if(diff===1){

            loginData.streak++;

        }else{

            loginData.streak=1;

        }

    }else{

        loginData.streak=1;

    }


    loginData.lastDate=today;

    loginData.claimed=true;

    loginData.totalDays++;


    const day=
        Math.min(
            7,
            loginData.streak
        );


    const rewards={
        1:{coins:20,score:500},
        2:{coins:25,score:700},
        3:{coins:30,score:1000},
        4:{coins:40,score:1300},
        5:{coins:50,score:1700},
        6:{coins:65,score:2200},
        7:{coins:100,score:5000}
    };


    const reward=
        rewards[day];


    coins+=reward.coins;

    score+=reward.score;


    if(
        typeof permanentCoins!=="undefined"
    ){

        permanentCoins+=
            reward.coins;

    }


    if(
        day===7
    ){

        unlockAchievement(
            "rich"
        );

    }


    saveLoginData();

    showLoginReward(
        day,
        reward
    );

}

        mainBoss
    )
        return;


    meteorEvent.active=true;

    meteorEvent.kills=0;

    meteorEvent.meteors=[];

    );

    );

/* =========================================================
   SPAWN
========================================================= */

function spawnMeteor(){

    const size=
        18+
        Math.random()*30;


    meteorEvent.meteors.push({

        x:
            Math.random()*
            W,

        y:-size-20,

        size:size,

        vx:
            -2+
            Math.random()*4,

        vy:
            7+
            Math.random()*7,

        rot:
            Math.random()*
            Math.PI*2,

        vr:
            -.08+
            Math.random()*.16,

        damage:
            1,

        life:180

    });

}


/* =========================================================
   METEOR UPDATE
========================================================= */

function updateMeteorEvent(){

    if(
        meteorEvent.cooldown>0
    ){

        meteorEvent.cooldown--;

    }


    if(!meteorEvent.active)
        return;


    meteorEvent.timer--;


    meteorEvent.spawnTimer--;


    if(
        meteorEvent.spawnTimer<=0
    ){

        const count=
            1+
            Math.floor(
                Math.random()*3
            );


        for(
            let i=0;
            i<count;
            i++
        ){

            spawnMeteor();

        }


        meteorEvent.spawnTimer=
            10+
            Math.floor(
                Math.random()*12
            );

    }


    /*
       meteor movement
    */

    for(
        let i=
            meteorEvent.meteors.length-1;
        i>=0;
        i--
    ){

        const meteor=
            meteorEvent.meteors[i];


        meteor.x+=meteor.vx;

        meteor.y+=meteor.vy;

        meteor.rot+=meteor.vr;

        meteor.life--;


        /*
           player hit
        */

        if(
            meteor.x>
                player.x &&
            meteor.x<
                player.x+
                player.w &&
            meteor.y>
                player.y &&
            meteor.y<
                player.y+
                player.h
        ){

            damagePlayer(
                meteor.damage
            );


            createLightBurst(
                meteor.x,
                meteor.y,
                "#ff3d00",
                1.5
            );


            meteorEvent.meteors.splice(
                i,
                1
            );

            continue;

        }


        /*
           ground explosion
        */

        if(
            meteor.y>
            groundY
        ){

            createMeteorExplosion(
                meteor.x,
                groundY
            );


            meteorEvent.meteors.splice(
                i,
                1
            );

            continue;

        }


        if(
            meteor.life<=0
        ){

            meteorEvent.meteors.splice(
                i,
                1
            );

        }

    }


    /*
       event end
    */

    if(
        meteorEvent.timer<=0
    ){

        endMeteorEvent();

    }

}


/* =========================================================
   EXPLOSION
========================================================= */

function createMeteorExplosion(
    x,
    y
){

    screenShake=5;


    createLightBurst(
        x,
        y,
        "#ff6d00",
        1
    );


    /*
       敵にもダメージ
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=
            enemies[i];

        if(!enemy)
            continue;


        const dx=
            enemy.x+
            enemy.w/2-
            x;

        const dy=
            enemy.y+
            enemy.h/2-
            y;


        const distance=
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(
            distance<90
        ){

            enemy.hp-=8;


            if(
                enemy.hp<=0
            ){

                killEnemy(enemy);

                meteorEvent.kills++;

                meteorEvent.score+=100;

            }

        }

    }


    /*
       particles
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                -4+
                Math.random()*8,

            vy:
                -6+
                Math.random()*5,

            life:25+
                Math.random()*20,

            size:
                2+
                Math.random()*5,

            color:"#ff6d00"

        });

    }

}


/* =========================================================
   DRAW METEORS
========================================================= */

function drawMeteorEvent(){

    if(
        !meteorEvent.active &&
        meteorEvent.meteors.length===0
    )
        return;


    for(
        const meteor
        of meteorEvent.meteors
    ){

        ctx.save();


        ctx.translate(
            meteor.x,
            meteor.y
        );


        ctx.rotate(
            meteor.rot
        );


        /*
           trail
        */

        const gradient=
            ctx.createLinearGradient(
                0,
                0,
                0,
                -meteor.size*3
            );


        gradient.addColorStop(
            0,
            "rgba(255,80,0,.9)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,80,0,0)"
        );


        ctx.fillStyle=
            gradient;


        ctx.fillRect(
            -meteor.size*.3,
            0,
            meteor.size*.6,
            -meteor.size*3
        );


        /*
           meteor
        */

        ctx.shadowBlur=25;

        ctx.shadowColor=
            "#ff3d00";


        ctx.fillStyle=
            "#ff6d00";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            meteor.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle=
            "#ffd180";


        ctx.beginPath();

        ctx.arc(
            -meteor.size*.25,
            -meteor.size*.25,
            meteor.size*.4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.restore();

    }


    /*
       event HUD
    */

    if(meteorEvent.active){

        ctx.save();

        ctx.textAlign="center";

        ctx.font=
            "900 24px Arial";

        ctx.fillStyle=
            "#ff6d00";

        ctx.shadowBlur=12;

        ctx.shadowColor=
            "#ff3d00";

        ctx.fillText(
            "☄ METEOR SHOWER",
            W/2,
            350
        );


        ctx.font=
            "bold 13px Arial";

        ctx.fillStyle="#fff";

        ctx.shadowBlur=0;

        ctx.fillText(
            Math.ceil(
                meteorEvent.timer/60
            )+
            "s",
            W/2,
            375
        );


        ctx.restore();

    }

}

    const finalStage=
        typeof stage==="number"
        ? stage
        : 1;

    const finalKills=
        typeof kills==="number"
        ? kills
        : 0;

    const finalCoins=
        typeof coins==="number"
        ? coins
        : 0;

    const finalRank=
        typeof rankName!=="undefined"

    const finalWave=
        typeof waveNumber!=="undefined"

        : 1;

    const trophyCount=
        typeof getTrophyCount==="function"
        ? getTrophyCount()

        typeof relics!=="undefined"
        ? relics.length
        : 0;

        typeof companionDrone!=="undefined"

        score:finalScore,

        stage:finalStage,

        kills:finalKills,

        coins:finalCoins,

        rank:finalRank,

        wave:finalWave,

        trophies:trophyCount,

/* =========================================================
   SHARE
========================================================= */

async function shareResult(){

    const text=
        getShareText();


    /*
       iPhoneなど対応環境では
       OS標準の共有画面を開く。
    */

    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "RED OR DEAD 2",

                text:text,

                url:
                    location.href

            });


            return;

        }catch(e){

            /*
               キャンセルなら何もしない
            */

            if(
                e &&
                e.name==="AbortError"
            ){

                return;

            }

        }

    }


    /*
       非対応時はコピーへ
    */

    await copyResult();

}


/* =========================================================
   COPY
========================================================= */

async function copyResult(){

    const text=
        getShareText();


    try{

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                text
            );

        }else{

            const area=
                document.createElement(
                    "textarea"
                );

            area.value=text;

            area.style.position=
                "fixed";

            area.style.opacity="0";

            document
                .body
                .appendChild(area);

            area.select();

            document.execCommand(
                "copy"
            );

            area.remove();

        }


        const btn=
            document.getElementById(
                "resultCopyBtn"
            );


        if(btn){

            const old=
                btn.textContent;

            btn.textContent=
                "✅ COPIED!";


            setTimeout(
                ()=>{

                    btn.textContent=
                        old;

                },
                1300
            );

        }

    }catch(e){

        alert(
            "コピーできませんでした"
        );

    }

}

/* =========================================================
   DOWNLOAD / SHARE IMAGE
========================================================= */

async function shareResultImage(){

    const c=
        drawShareImage();


    /*
       Canvas → PNG
    */

    const blob=
        await new Promise(
            resolve=>
                c.toBlob(
                    resolve,
                    "image/png"
                )
        );


    if(!blob)
        return;


    const file=
        new File(
            [blob],
            "red-or-dead-2-result.png",
            {
                type:"image/png"
            }
        );


    /*
       iPhone等の対応ブラウザでは
       画像ファイルを直接共有
    */

    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files:[file]
        })
    ){

        try{

            await navigator.share({

                title:
                    "RED OR DEAD 2",

                text:
                    "🔥 RED OR DEAD 2 RESULT",

                files:[
                    file
                ]

            });


            return;

        }catch(e){

            if(
                e &&
                e.name==="AbortError"
            ){

                return;

            }

        }

    }


    /*
       共有非対応ならPNG保存
    */

    const url=
        URL.createObjectURL(
            blob
        );


    const a=
        document.createElement(
            "a"
        );


    a.href=url;

    a.download=
        "red-or-dead-2-result.png";


    document
        .body
        .appendChild(a);


    a.click();

    a.remove();


    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

}

========================================================= */

const LOCAL_RANK_KEY =
    "red_or_dead_2_local_scores";

let localScores=[];


/* =========================================================
   LOAD
========================================================= */

function loadLocalScores(){

    try{

        const saved=
            JSON.parse(
                localStorage.getItem(
                    LOCAL_RANK_KEY
                )
            );

        if(Array.isArray(saved)){

            localScores=saved;

        }

    }catch(e){

        localScores=[];

    }


    localScores=
        localScores
        .filter(
            x=>
                x &&
                typeof x.score==="number"
        )
        .sort(
            (a,b)=>
                b.score-a.score
        )
        .slice(0,10);

}


/* =========================================================
   SAVE
========================================================= */

function saveLocalScores(){

    try{

        localStorage.setItem(
            LOCAL_RANK_KEY,
            JSON.stringify(
                localScores
            )
        );

    }catch(e){}

}


/* =========================================================
   ADD SCORE
========================================================= */

function addLocalScore(){

    const r=
        getResultData();


    localScores.push({

        score:r.score,

        stage:r.stage,

        wave:r.wave,

        kills:r.kills,

        rank:r.rank,

        date:
            new Date()
            .toLocaleDateString(
                "ja-JP"
            )

    });


    localScores.sort(
        (a,b)=>
            b.score-a.score
    );


    localScores=
        localScores.slice(
            0,
            10
        );


    saveLocalScores();

}


/* =========================================================
   CURRENT RANK
========================================================= */

function getCurrentLocalRank(){

    const r=
        getResultData();


    let position=1;


    for(
        const entry
        of localScores
    ){

        if(
            entry.score>r.score
        ){

            position++;

        }

    }


    return position;

}

function initOnlineLeaderboard(){

    if(typeof supabase === "undefined"){
        console.log("Supabase library not found.");
        return false;
    }

    if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
        console.log("Supabase URL / key not found.");
        return false;
    }

    try{

        onlineSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        console.log("Supabase connected.");

        return true;

    }catch(e){

        console.log(
            "Supabase init error:",
            e
        );

        return false;
    }
}

========================================================= */

function getOnlinePlayerId(){

    let id =
        localStorage.getItem(
            "red_or_dead_2_player_id"
        );

    if(!id){

        id =
            "PLAYER-" +
            Date.now().toString(36) +
            "-" +
            Math.random()
                .toString(36)
                .slice(2,8)
                .toUpperCase();

        localStorage.setItem(
            "red_or_dead_2_player_id",
            id
        );
    }

    return id;
}

   4. プレイヤー名
========================================================= */

function getPlayerName(){

    let name =
        localStorage.getItem(
            "red_or_dead_2_player_name"
        );

    if(!name){

        name =
            "PLAYER " +
            Math.floor(
                1000 +
                Math.random() * 9000
            );

        localStorage.setItem(
            "red_or_dead_2_player_name",
            name
        );
    }

    return name;
}


/* =========================================================
   5. スコア送信
========================================================= */

async function submitOnlineScore(){

    if(!onlineSupabase){
        return false;
    }

    const r =
        getResultData();

    try{

        const { error } =
            await onlineSupabase
            .from("leaderboard")
            .insert({

                player_id:
                    getOnlinePlayerId(),

                player_name:
                    getPlayerName(),

                score:
                    r.score,

                stage:
                    r.stage,

                wave:
                    r.wave,

                kills:
                    r.kills,

                rank:
                    r.rank
            });

        if(error){

            console.log(
                "Score upload error:",
                error
            );

            return false;
        }

        console.log(
            "Score uploaded!"
        );

        return true;

    }catch(e){

        console.log(
            "Score upload exception:",
            e
        );

        return false;
    }
}


/* =========================================================
   6. オンラインランキング取得
========================================================= */

async function getOnlineScores(){

    if(!onlineSupabase){
        return [];
    }

    try{

        const { data, error } =
            await onlineSupabase
            .from("leaderboard")
            .select(
                "player_name,score,stage,wave,kills,rank"
            )
            .order(
                "score",
                {
                    ascending:false
                }
            )
            .limit(20);

        if(error){

            console.log(
                "Leaderboard load error:",
                error
            );

            return [];
        }

        return data || [];

    }catch(e){

        console.log(
            "Leaderboard exception:",
            e
        );

        return [];
    }
}

function escapeLeaderboardText(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
